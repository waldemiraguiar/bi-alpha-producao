name: Vigia da Frota (health check + alerta)

# Roda no servidor do GitHub (independe de app aberto). A cada 15 min no horário de operação,
# testa DE VERDADE o painel de Triagem/Produção (site, dados, ler, GRAVAR+ler de volta, e se a
# leitura paginada traz TODAS as marcas — o bug de 08/jul). Só AVISA (e-mail + WhatsApp) se QUEBRAR.
# Objetivo SRE: detectar a pane ANTES da equipe sentir (ontem a equipe descobriu, horas depois).

on:
  schedule:
    - cron: '*/15 0-2,9-23 * * *'   # a cada 15 min, ~06h-23h BRT (UTC=BRT+3; 0-2 cobre a 2ª rotina da noite)
  workflow_dispatch:            # rodar agora p/ testar

concurrency:
  group: vigia-frota
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check da frota + alerta
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          CALLMEBOT_PHONE:    ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY:   ${{ secrets.CALLMEBOT_APIKEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          MYSQL_HOST:         ${{ secrets.MYSQL_HOST }}
          MYSQL_USER:         ${{ secrets.MYSQL_USER }}
          MYSQL_PWD:          ${{ secrets.MYSQL_PWD }}
          MYSQL_DB:           ${{ secrets.MYSQL_DB }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pymysql 2>/dev/null || pip3 install --quiet pymysql 2>/dev/null || true
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, datetime, time, smtplib, ssl
          from email.mime.text import MIMEText

          SUPA="https://lrwjcdvporaivxvfuiwt.supabase.co/rest/v1"
          KEY="sb_publishable_fcodHc3AxR_HQ-aduMGzlg_CTBALng8"
          SITE="https://producao-lab-alpha.netlify.app"

          def http(url, method="GET", headers=None, data=None, timeout=25):
              req=urllib.request.Request(url, method=method, data=data, headers=headers or {})
              r=urllib.request.urlopen(req, timeout=timeout)
              return r.status, r.read(), dict(r.headers)
          def supa(path, method="GET", headers=None, body=None):
              h={"apikey":KEY,"Authorization":"Bearer "+KEY}
              if headers: h.update(headers)
              d=body.encode() if isinstance(body,str) else body
              return http(SUPA+path, method, h, d)

          falhas=[]; ctx=[]
          # 1) site do painel no ar
          try:
              st,_,_=http(SITE+"/?_="+str(int(time.time())))
              if st!=200: falhas.append(f"Site do painel: HTTP {st}")
          except Exception as e: falhas.append(f"Site do painel: {e}")
          # 2) dados do painel (/api/enc) frescos
          try:
              st,b,_=http(SITE+"/api/enc?_="+str(int(time.time())))
              if st!=200 or len(b)<1000: falhas.append(f"Dados do painel (/api/enc): HTTP {st}, {len(b)}b")
          except Exception as e: falhas.append(f"Dados do painel (/api/enc): {e}")
          # 3) Supabase LER
          try:
              st,_,_=supa("/sep_marks?select=chave&limit=1")
              if st!=200: falhas.append(f"Supabase leitura: HTTP {st}")
          except Exception as e: falhas.append(f"Supabase leitura: {e}")
          # 4) Supabase GRAVAR + ler de volta + apagar (caminho real do separar)
          hc="zzz_vigia_"+datetime.datetime.utcnow().strftime("%H%M%S")
          try:
              st,_,_=supa("/sep_marks","POST",{"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"},json.dumps({"chave":hc,"estado":"separado","por":"vigia"}))
              if st not in (200,201): falhas.append(f"Supabase gravação: HTTP {st}")
              else:
                  st2,b,_=supa("/sep_marks?chave=eq."+hc+"&select=chave")
                  if not (st2==200 and json.loads(b)): falhas.append("Gravou mas não leu de volta")
              supa("/sep_marks?chave=eq."+hc,"DELETE")
          except Exception as e: falhas.append(f"Supabase gravação: {e}")
          # 5) PAGINAÇÃO: a leitura traz TODAS as marcas? (o bug de 08/jul = corte em 1000)
          total=0
          try:
              st,_,h=supa("/sep_marks?select=chave&limit=1",headers={"Prefer":"count=exact","Range":"0-0"})
              total=int((h.get("Content-Range") or h.get("content-range") or "/0").split("/")[-1])
              loaded=0; frm=0
              while True:
                  st,b,_=supa(f"/sep_marks?select=chave&offset={frm}&limit=1000")
                  n=len(json.loads(b)); loaded+=n
                  if n<1000: break
                  frm+=1000
              ctx.append(f"sep_marks: {total} marcas (paginação carregou {loaded})")
              if loaded<total: falhas.append(f"Painel não carrega TODAS as marcas: {loaded}/{total} (bug tipo 08/jul!)")
          except Exception as e: falhas.append(f"Check paginação: {e}")

          agora=(datetime.datetime.utcnow()-datetime.timedelta(hours=3)).strftime("%d/%m %H:%M BRT")
          def alerta(assunto, corpo, wa):
              try:
                  GU=os.environ["GMAIL_USER"]; GP=os.environ["GMAIL_APP_PASSWORD"]; TO=os.environ.get("EMAIL_TO") or GU
                  m=MIMEText(corpo,"plain","utf-8"); m["Subject"]=assunto; m["From"]=GU; m["To"]=TO
                  with smtplib.SMTP_SSL("smtp.gmail.com",465,context=ssl.create_default_context()) as s:
                      s.login(GU,GP); s.sendmail(GU,[TO],m.as_string())
                  print("email enviado:",assunto)
              except Exception as e: print("email falhou:",e)
              try:
                  ph=os.environ.get("CALLMEBOT_PHONE","").strip(); ak=os.environ.get("CALLMEBOT_APIKEY","").strip()
                  if ph and ak:
                      u=("https://api.callmebot.com/whatsapp.php?phone="+urllib.parse.quote(ph)+"&text="+urllib.parse.quote(wa)+"&apikey="+urllib.parse.quote(ak))
                      urllib.request.urlopen(u,timeout=30).read(); print("whatsapp enviado")
              except Exception as e: print("whatsapp falhou:",e)

          # ---- CAÇA-RUNAWAY 2 NÍVEIS: aviso (rajada) + DISJUNTOR (corte automático) ----
          # Conta deploys de PRODUÇÃO por site nos últimos ~35 min (TAXA, não total/dia → sem estado,
          # sem spam em dia de dev). Nível 1 (WARN_N): só avisa. Nível 2 (CUT_N): FREIA o site ofensor.
          # Freio por tipo (ambos REVERSÍVEIS): git-build → stop_builds; deploy-direto → trava o deploy
          # publicado (a versão no ar SEGUE servindo a equipe; só bloqueia publicar código novo/loop).
          # PROTEGIDOS = apps operacionais da equipe: SÓ avisam, NUNCA cortam automático.
          WARN_N=12; CUT_N=20; BURST_MIN=35
          PROTEGIDOS={"producao-lab-alpha"}
          try:
              NT=os.environ.get("NETLIFY_AUTH_TOKEN","").strip()
              if NT:
                  def napi(p, method="GET", body=None):
                      data=json.dumps(body).encode() if body is not None else None
                      h={"Authorization":"Bearer "+NT}
                      if body is not None: h["Content-Type"]="application/json"
                      rq=urllib.request.Request("https://api.netlify.com/api/v1"+p, method=method, data=data, headers=h)
                      rr=urllib.request.urlopen(rq, timeout=25); bb=rr.read()
                      return rr.status, (json.loads(bb) if bb else {})
                  corte_ts=datetime.datetime.utcnow()-datetime.timedelta(minutes=BURST_MIN)
                  avisos=[]; cortes=[]
                  _,allsites=napi("/sites?per_page=100")
                  for s in allsites:
                      sid=s.get("id"); nm=s.get("name","")
                      if not sid: continue
                      try: _,deps=napi(f"/sites/{sid}/deploys?per_page=100")
                      except Exception: continue
                      n=0
                      for d in deps:
                          if d.get("context")!="production": continue
                          ts=(d.get("created_at") or "")[:19]
                          try: t=datetime.datetime.strptime(ts,"%Y-%m-%dT%H:%M:%S")
                          except Exception: continue
                          if t>=corte_ts: n+=1
                      if n<WARN_N: continue
                      if n>=CUT_N and nm not in PROTEGIDOS:
                          bs=s.get("build_settings") or {}
                          git=bool(bs.get("repo_url") or bs.get("provider"))
                          acao="?"
                          try:
                              if git:
                                  napi(f"/sites/{sid}","PATCH",{"build_settings":{"stop_builds":True}})
                                  acao="builds parados (stop_builds=true)"
                              else:
                                  dep=(s.get("published_deploy") or {}).get("id")
                                  if dep:
                                      napi(f"/deploys/{dep}/lock","POST")
                                      acao="deploy publicado TRAVADO (versão no ar mantida)"
                                  else:
                                      acao="sem deploy p/ travar — só avisei"
                          except Exception as e:
                              acao=f"FALHOU o freio: {e}"
                          cortes.append((nm,n,acao))
                      else:
                          tag=" (PROTEGIDO: só aviso)" if (n>=CUT_N and nm in PROTEGIDOS) else ""
                          avisos.append((nm,n,tag))
                  if cortes or avisos:
                      linhas=[]
                      if cortes:
                          linhas.append("🔴 CORTADO (disjuntor armou):")
                          linhas += [f"  • {nm}: {n} deploys/{BURST_MIN}min → {ac}" for nm,n,ac in cortes]
                      if avisos:
                          linhas.append("⚠️ Rajada (só aviso):")
                          linhas += [f"  • {nm}: {n} deploys/{BURST_MIN}min{tag}" for nm,n,tag in avisos]
                      corpo=(f"Wal ({agora}) — o caça-runaway de deploy disparou.\n\n"+"\n".join(linhas)
                             +"\n\nSe foi VOCÊ desenvolvendo, tudo bem. Se NÃO foi, é loop/auto-deploy — a FONTE "
                             +"(GitHub Action/build hook) precisa ser cortada.\n\n"
                             +"RELIGAR quando seguro: git-build → pôr stop_builds=false no site; deploy travado → "
                             +"destravar (unlock) o deploy publicado.\n"
                             +"A equipe NÃO para: o app no ar e os dados do Supabase seguem normais (deploy só troca CÓDIGO).")
                      assunto=("🔴 DISJUNTOR armou: "+", ".join(nm for nm,_,_ in cortes)) if cortes else ("🔥 Rajada de deploy: "+", ".join(nm for nm,_,_ in avisos))
                      wa=(("🔴 Disjuntor armou: "+", ".join(f"{nm}({n})" for nm,n,_ in cortes)+". Freado p/ proteger crédito; equipe segue normal.") if cortes
                          else ("🔥 Rajada: "+", ".join(f"{nm}({n})" for nm,n,_ in avisos)+". Se não foi você, corte a fonte."))
                      alerta(assunto, corpo, wa)
                      print("CACA-RUNAWAY:",assunto)
                  else:
                      print("caca-runaway: nada (warn>=%d, cut>=%d /%dmin)"%(WARN_N,CUT_N,BURST_MIN))
              else:
                  print("caca-runaway: NETLIFY_AUTH_TOKEN ausente")
          except Exception as e:
              print("caca-runaway falhou:",e)

          # ---- FRESCOR DO DADO: a CÓPIA que o painel lê está atualizando? ----
          # O painel lê a réplica MySQL bi_alpha. Se ela CONGELA (a replicação do HF parou —
          # aconteceu 21/jul 17:56), o site responde 200 e a paginação passa, MAS o dado está
          # velho e a equipe NÃO vê o que acabou de entrar. Este é o check que teria gritado.
          # Alerta só nas horas de MOVIMENTO (evita falso-positivo de madrugada/lab fechado).
          try:
              import pymysql
              MH=os.environ.get("MYSQL_HOST"); MU=os.environ.get("MYSQL_USER")
              MP=os.environ.get("MYSQL_PWD"); MDB=os.environ.get("MYSQL_DB") or "bi_alpha"
              if MH and MU and MP:
                  cnx=pymysql.connect(host=MH,user=MU,password=MP,database=MDB,connect_timeout=20,charset="utf8mb4")
                  with cnx.cursor() as mc:
                      mc.execute("SELECT NOW()"); now_db=mc.fetchone()[0]
                      mc.execute("SELECT MAX(DataModificacao) FROM `TabExameNumeroRequisiçao`"); ult=mc.fetchone()[0]
                  cnx.close()
                  if ult:
                      atraso=(now_db-ult).total_seconds()/60.0
                      hbrt=(datetime.datetime.utcnow()-datetime.timedelta(hours=3)).hour
                      STALE_MIN=90
                      if atraso>STALE_MIN and 9<=hbrt<=22:
                          falhas.append(f"CÓPIA do painel CONGELADA: sem dado novo há {int(atraso)} min (última mudança {ult}). A réplica bi_alpha parou de atualizar — a equipe NÃO vê o que entrou agora. O painel responde mas está velho.")
                          ctx.append(f"frescor: última {ult}, atraso {int(atraso)}min")
                      else:
                          ctx.append(f"frescor OK: última {ult} ({int(atraso)}min atrás)")
                  else:
                      ctx.append("frescor: sem DataModificacao (?)")
              else:
                  print("frescor: MYSQL_* ausente")
          except Exception as e:
              print("frescor check falhou:", e)

          # PANE (qualquer check falhou) -> alerta NA HORA
          if falhas:
              corpo=(f"ALERTA Wal ({agora}) — o painel está com problema pra a equipe:\n\n"
                     + "\n".join("❌ "+f for f in falhas)
                     + ("\n\nContexto: "+" | ".join(ctx) if ctx else "")
                     + "\n\nA equipe pode estar travada. Enquanto verifica: modo papel (separa físico, marca depois — nada se perde).")
              alerta("🚨 PANE no painel de Triagem/Produção", corpo,
                     f"🚨 PANE no painel Triagem/Produção ({agora}): "+"; ".join(falhas[:3])+". Equipe pode estar travada — modo papel enquanto verifica.")
              raise SystemExit(0)

          # SATURAÇÃO: a tabela cresce sempre (finalizadas não são apagadas). Aviso GENTIL 1x/dia
          # (só na rodada ~08h BRT). NÃO é pane — o painel funciona (paginação lê tudo); é heads-up
          # p/ arquivar as finalizadas antes de ficar pesado.
          _h=datetime.datetime.utcnow()
          if total>3000 and _h.hour==11 and _h.minute<15:
              alerta("📈 sep_marks grande — hora de arquivar as finalizadas",
                     f"Heads-up Wal ({agora}): sep_marks está com {total} linhas e cresce sempre. O painel FUNCIONA "
                     f"(a paginação lê tudo), mas fica mais pesado/lento conforme cresce. Vale rodar a limpeza/arquivo "
                     f"das marcas antigas 'suficiente'. Sem urgência.",
                     f"📈 sep_marks: {total} linhas (cresce sempre). Painel ok, mas vale arquivar as finalizadas. Sem urgência.")
          print(f"[{agora}] ✅ frota OK — {' | '.join(ctx)}")
          PY
