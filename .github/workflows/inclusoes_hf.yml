name: Inclusões — espelho do HF (requisições recentes → Supabase)

# Alimenta o botão "+ Nova inclusão" do Quadro de Inclusões (puxa pet/clínica pelo nº da requisição).
# Só leitura no MySQL. A cada 30 min das 7h às 21h (BRT) — barato em minutos do GitHub.

on:
  schedule:
    - cron: '5,35 10-23 * * *'   # 7h05–20h35 BRT
    - cron: '5 0 * * *'          # 21h05 BRT
  workflow_dispatch:
  # 17/set: o GitHub PULOU os crons (só 4 execuções em 24 h; nenhuma de 01h43 a 11h45). O painel de produção roda
  # de 10 em 10 min por dispatch confiável → pega carona: roda logo depois de cada execução dele (repo público, sem custo).
  workflow_run:
    workflows: ["Atualiza Painel de Produção"]
    types: [completed]

concurrency:
  group: inclusoes-hf
  cancel-in-progress: true

jobs:
  sync:
    # carona só das 7h às 21h BRT (10–00 UTC); cron e manual rodam sempre
    if: github.event_name != 'workflow_run' || !(startsWith(github.event.workflow_run.created_at, '') && (contains(github.event.workflow_run.created_at, 'T01:') || contains(github.event.workflow_run.created_at, 'T02:') || contains(github.event.workflow_run.created_at, 'T03:') || contains(github.event.workflow_run.created_at, 'T04:') || contains(github.event.workflow_run.created_at, 'T05:') || contains(github.event.workflow_run.created_at, 'T06:') || contains(github.event.workflow_run.created_at, 'T07:') || contains(github.event.workflow_run.created_at, 'T08:') || contains(github.event.workflow_run.created_at, 'T09:')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install --quiet pymysql
      - name: Sync requisições recentes (HF → Supabase)
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PWD:  ${{ secrets.MYSQL_PWD }}
          MYSQL_DB:   ${{ secrets.MYSQL_DB }}
          HISTO_INTAKE_TOKEN: ${{ secrets.HISTO_INTAKE_TOKEN }}
        run: python inclusoes_hf_sync.py
