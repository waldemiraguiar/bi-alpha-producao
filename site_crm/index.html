<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente CRM — Matriz · Alpha Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="skin.css">
<link rel="icon" href="logo.png">
<style>
  /* ---- ajustes específicos do Agente CRM (sobre a skin) ---- */
  .wrap{max-width:1320px;margin:0 auto;padding:0 24px 60px}
  .brand .sb .fleet{color:var(--cyan)}
  .clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--mut);font-size:13px}
  .topright{display:flex;align-items:center;gap:14px}

  /* hero RADAR DE REATIVAÇÃO */
  .radar{display:flex;align-items:center;gap:22px;border-radius:16px;padding:18px 26px;margin:18px 0 6px;
    border:2px solid #fff;animation:urgblink .9s steps(1,end) infinite}
  .radar .ico{font-size:40px;animation:sirene .9s ease-in-out infinite}
  .radar .big{font-size:46px;font-weight:900;color:#fff;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
  .radar .lbl{font-size:15px;font-weight:800;color:#fff;letter-spacing:.02em;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .radar .sub{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:2px}
  .radar.calm{animation:none;background:linear-gradient(90deg,rgba(0,229,160,.25),rgba(0,212,255,.18));border-color:rgba(0,229,160,.5)}
  .radar.calm .ico{animation:none}
  .radar .ring,.hero .ring{flex:0 0 auto}
  @media(max-width:720px){
    .radar{flex-wrap:wrap;justify-content:center;text-align:center;gap:14px}
    .radar .big{font-size:40px}
    .radar>div:nth-child(3){flex:1 1 100%}
    .crow{grid-template-columns:28px 1fr;gap:8px}
    .crow .mid{grid-column:2;justify-content:flex-start}
    .crow .acao,.crow .pr{grid-column:2;justify-self:start}
  }

  .kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
  .hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;margin:6px 0 14px}
  @media(max-width:720px){.hero{grid-template-columns:1fr}}

  /* worklist do CRM */
  .crow{display:grid;grid-template-columns:36px 1fr auto auto;gap:14px;align-items:center;
    padding:11px 14px;border-radius:11px;background:linear-gradient(180deg,var(--card),var(--navy2));
    border:1px solid var(--line);margin-bottom:8px}
  .crow .rk{font-size:13px;font-weight:900;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
  .crow .nm{font-weight:800;font-size:15px}
  .crow .ci{font-size:12px;color:var(--mut);margin-top:2px}
  .crow .mid{display:flex;align-items:center;gap:16px}
  .crow .delta{font-size:16px;font-weight:900;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
  .crow .delta.down{color:var(--red)} .crow .delta.up{color:var(--azul)} .crow .delta.flat{color:var(--mut)}
  .crow .acao{font-size:12.5px;font-weight:700;color:var(--ink);background:rgba(255,176,32,.12);
    border:1px solid rgba(255,176,32,.35);border-radius:8px;padding:6px 11px;white-space:nowrap}
  .crow .acao.hot{background:rgba(255,84,112,.14);border-color:rgba(255,84,112,.4);color:#ffb3c0}
  .pr{font-size:10px;font-weight:900;border-radius:6px;padding:2px 8px;letter-spacing:.03em;text-transform:uppercase}
  .pr.parado{background:var(--red);color:#fff}
  .pr.queda_forte{background:#FF2D55;color:#fff}
  .pr.queda{background:rgba(255,84,112,.18);color:#ffb3c0}
  .pr.novo_esfriando{background:var(--amber);color:var(--navy)}
  .pr.alta{background:rgba(77,157,255,.18);color:var(--azul)}
  .pr.parado-sit{background:rgba(255,84,112,.18);color:#ffb3c0}
  .pr.estável{background:rgba(138,162,189,.16);color:var(--mut)}
  .spk{display:block}
  /* botão de follow-up (toggle compartilhado pela equipe) */
  .rcell{display:flex;align-items:center;gap:10px;justify-content:flex-end}
  .fubtn{font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap;
    border-radius:8px;padding:7px 11px;background:transparent;border:1px solid rgba(0,212,255,.45);color:var(--cyan)}
  .fubtn:hover{background:rgba(0,212,255,.1)}
  .fubtn.on{background:var(--green);border-color:var(--green);color:var(--navy)}
  .crow.done{opacity:.62;border-color:rgba(0,229,160,.4)}
  .crow.done .acao{opacity:.5}
  .seclabel{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
  .seclabel::after{content:"";flex:1;height:1px;background:var(--line)}
  .empty{color:var(--mut);font-size:14px;padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  .tabsbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .demo-flag{display:none;font-size:11px;font-weight:800;color:var(--navy);background:var(--amber);border-radius:6px;padding:3px 10px;letter-spacing:.04em}
  .demo-flag.on{display:inline-block}
</style>
</head>
<body>

<!-- ===== GATE (senha do time CRM) ===== -->
<div id="gate">
  <form id="gateForm" class="gate-card">
    <img src="logo-full.png" alt="Alpha Labs" style="height:120px;margin-bottom:18px">
    <div style="font-weight:900;font-size:19px;letter-spacing:-.01em">Agente CRM — Matriz</div>
    <div style="color:var(--mut);font-size:12px;margin:4px 0 20px;letter-spacing:.14em;text-transform:uppercase">Agentes de IA Alpha</div>
    <input id="gatePwd" type="password" placeholder="Senha do time CRM" autocomplete="current-password" autofocus>
    <button id="gateBtn" type="submit">Entrar</button>
    <div id="gateErr" class="gate-err"></div>
  </form>
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none">
  <div class="bar">
    <div class="brand">
      <img class="logo" src="logo.png" alt="Alpha Labs">
      <div>
        <h1>Agente CRM <span style="color:var(--cyan)">·</span> Matriz</h1>
        <div class="sb">Movimentação de clientes <span class="fleet">· Agentes de IA Alpha</span></div>
      </div>
    </div>
    <div class="topright">
      <span class="demo-flag" id="demoFlag">DEMONSTRAÇÃO</span>
      <span class="dot" title="ao vivo"></span>
      <span class="clock" id="clock">--:--</span>
      <span class="rotctl" id="rotctl">⏸ Fixar aba</span>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="wrap">
    <div id="content"></div>
    <div style="color:var(--mut);font-size:11.5px;margin-top:30px;text-align:center" id="foot"></div>
  </div>
</div>

<script src="gate-crypto.js"></script>
<script src="app.js"></script>
</body>
</html>
