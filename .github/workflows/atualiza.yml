name: Atualiza Painel de Produção

on:
  schedule:
    # SOLUÇÃO DE CUSTO (28/jun): cada DEPLOY de prod custa ~15 créditos (~US$0,10).
    # Em vez de re-deployar o site só p/ trocar o .enc, o build PUBLICA o .enc por função
    # (POST /api/enc — web request baratíssimo). Exames seguem 10 min, deploys ~0.
    - cron: '*/10 0-2,9-23 * * *'   # build + POST do .enc (barato) — horário útil BRT (UTC=BRT+3)
    - cron: '13 12 * * *'           # 1x/dia: DEPLOY completo (~09h13 BRT) — refresca fallback estático + código
  workflow_dispatch:                # dispatch SEM deploy=1 => só build+POST (barato). deploy=1 => deploy completo.
    inputs:
      deploy:
        description: "deploy=1 publica o site (após mexer no código); senão só atualiza dados (POST)"
        required: false
        default: "0"
      sweep:
        description: "Rodar varredura do cofre (lista exames faltando)"
        required: false
        default: "0"

concurrency:
  group: atualiza-producao
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # evita aviso de descontinuação do Node 20
  # DEPLOY completo só no cron diário OU dispatch com deploy=1. Dispatch comum (ex.: disparador externo
  # de 10 em 10 min) faz APENAS build+POST do .enc (barato, mantém dados frescos sem deploy).
  DEPLOY_FULL: ${{ github.event.inputs.deploy == '1' || github.event.schedule == '13 12 * * *' }}

jobs:
  atualiza:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install --quiet pymysql cryptography

      - name: Gerar e cifrar dados de produção
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PWD:  ${{ secrets.MYSQL_PWD }}
          MYSQL_DB:   ${{ secrets.MYSQL_DB }}
          PROD_PWD:   ${{ secrets.PROD_PWD }}
          SWEEP_COFRE: ${{ github.event.inputs.sweep }}
        run: python build_and_encrypt.py

      # PUBLICA OS DADOS por função (todo run): atualiza o .enc SEM deploy. Se falhar, o
      # fallback estático (data/producao.enc, refrescado no deploy diário) cobre — não falha o run.
      - name: Publicar dados (.enc) via função — barato, sem deploy
        continue-on-error: true
        env:
          PROD_PWD: ${{ secrets.PROD_PWD }}
        run: |
          code=$(curl -sS -o /tmp/encresp.txt -w "%{http_code}" -X POST \
            "https://producao-lab-alpha.netlify.app/api/enc" \
            -H "x-pwd: $PROD_PWD" -H "content-type: application/json" \
            --data-binary @site_prod/data/producao.enc) || code=000
          echo "POST /api/enc -> HTTP $code ; $(cat /tmp/encresp.txt)"
          if [ "$code" != "200" ]; then echo "::warning::POST do .enc falhou (HTTP $code) — fallback estático cobre"; fi

      # --- abaixo só roda no DEPLOY completo (1x/dia ou manual) ---
      - name: Config + dependências da função
        if: env.DEPLOY_FULL == 'true'
        env:
          PROD_PWD: ${{ secrets.PROD_PWD }}
          ADMIN_PWD: ${{ secrets.ADMIN_PWD }}
        run: |
          node -e "require('fs').writeFileSync('site_prod/functions/secret.mjs','export const SECRET='+JSON.stringify(process.env.PROD_PWD||'')+';\n')"
          node -e "require('fs').writeFileSync('site_prod/functions/admin.mjs','export const ADMIN='+JSON.stringify(process.env.ADMIN_PWD||'')+';\n')"
          cd site_prod/functions && npm init -y >/dev/null 2>&1 && npm install @netlify/blobs >/dev/null 2>&1 && echo "func pronta"

      # ⛔ 24/set: cinco commits seguidos mexeram no inc.js sem subir o `?v=` do index.html.
      # O arquivo subia certo (o curl provava), mas o NAVEGADOR de quem ja tinha aberto a pagina
      # continuava servindo a versao velha do cache — ou seja, a equipe nao via o conserto.
      # Carimbar na mao e uma etapa que da pra esquecer, e eu esqueci. Agora o proprio deploy
      # carimba: o `?v=` vira o hash do conteudo, entao muda sozinho quando o arquivo muda e
      # NAO muda quando o arquivo e o mesmo (cache continua valendo quando deve valer).
      - name: Carimbar versao dos estaticos (mata cache velho sem Cmd+Shift+R)
        if: env.DEPLOY_FULL == 'true'
        run: |
          python3 - <<'EOF'
          import hashlib, re, pathlib
          raiz = pathlib.Path('site_prod')
          mudou = 0
          for html in raiz.rglob('*.html'):
              txt = original = html.read_text(encoding='utf-8')
              def carimbo(m):
                  arq = html.parent / m.group('arq')
                  if not arq.exists(): return m.group(0)
                  h = hashlib.sha1(arq.read_bytes()).hexdigest()[:8]
                  return f'{m.group("arq")}?v={h}'
              txt = re.sub(r'(?P<arq>[A-Za-z0-9_./-]+\.(?:js|css))\?v=[A-Za-z0-9]+', carimbo, txt)
              if txt != original:
                  html.write_text(txt, encoding='utf-8'); mudou += 1
                  print(f'  carimbado: {html}')
          print(f'{mudou} arquivo(s) HTML carimbado(s)')
          EOF

      - name: Publicar no Netlify (deploy completo)
        if: env.DEPLOY_FULL == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes netlify-cli@26 deploy --prod --dir=site_prod --functions=site_prod/functions --site=${{ secrets.PROD_SITE_ID }}
