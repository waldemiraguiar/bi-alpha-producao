name: Briefing 3x/dia (7h · 12h · 17h — e-mail + WhatsApp)

on:
  schedule:
    - cron: '0 10 * * *'    # 10:00 UTC = 07:00 BRT — Matinal
    - cron: '0 15 * * *'    # 15:00 UTC = 12:00 BRT — Meio-dia
    - cron: '0 20 * * *'    # 20:00 UTC = 17:00 BRT — Fim de tarde
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  aviso:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet cryptography
      - name: Enviar briefing diário
        env:
          CRM_PWD: ${{ secrets.CRM_PWD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CAL_ICS_URL: ${{ secrets.CAL_ICS_URL }}
        run: python aviso_diario_crm.py
