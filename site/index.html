<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BI Alpha · Produção & Faturamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0A1628; --navy2:#0F2138; --card:#10243d; --line:rgba(0,212,255,.18);
  --ink:#F5F7FA; --mut:#8aa2bd; --cyan:#00D4FF; --green:#00E5A0; --amber:#FFB020;
  --red:#FF5470; --purple:#A78BFA; --grid:rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:
   radial-gradient(1200px 600px at 80% -10%,rgba(0,212,255,.08),transparent 60%),
   radial-gradient(1000px 500px at -10% 10%,rgba(0,229,160,.06),transparent 55%),var(--navy);
  color:var(--ink);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:32px 24px 80px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:14px}
.logo{height:46px;width:auto;object-fit:contain;display:block}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px;font-weight:400}
.period{text-align:right;font-size:12px;color:var(--mut)}
.period b{color:var(--cyan);font-weight:600}
.note-fin{margin:18px 0 26px;padding:12px 16px;border:1px solid rgba(255,176,32,.3);border-radius:8px;
  background:rgba(255,176,32,.07);font-size:12.5px;color:#ffd98a}
.note-fin b{color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:30px}
.kpi{background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
.kpi.g::before{background:var(--green)} .kpi.a::before{background:var(--amber)} .kpi.p::before{background:var(--purple)}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.kpi .val{font-size:25px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.kpi .delta{font-size:11.5px;margin-top:4px;color:var(--mut)}
.kpi .delta.up{color:var(--green)} .kpi .delta.down{color:var(--red)}
.sec-title{display:flex;align-items:center;gap:10px;margin:34px 0 14px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.sec-title .bar{width:4px;height:18px;border-radius:2px;background:var(--cyan)}
.sec-title small{color:var(--mut);font-weight:400;font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:2fr 1fr} .g13{grid-template-columns:1fr 2fr}
.card{background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px}
.card .cap{font-size:11.5px;color:var(--mut);margin-bottom:14px}
.chartbox{position:relative;height:300px}
.chartbox.sm{height:240px} .chartbox.lg{height:340px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04)}
tr:hover td{background:rgba(0,212,255,.04)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.rk{display:inline-flex;width:20px;height:20px;border-radius:6px;background:rgba(0,212,255,.12);color:var(--cyan);font-size:10.5px;font-weight:700;align-items:center;justify-content:center;margin-right:2px}
.pill{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(0,229,160,.12);color:var(--green);font-weight:600}
.pill.r{background:rgba(255,84,112,.12);color:var(--red)}
.scrolly{max-height:360px;overflow-y:auto}
.scrolly::-webkit-scrollbar{width:6px}.scrolly::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:3px}
.mini{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
.mini .m{flex:1;min-width:120px}
.mini .m .v{font-size:20px;font-weight:700} .mini .m .l{font-size:11px;color:var(--mut)}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;text-align:center}
.loading{text-align:center;padding:80px;color:var(--mut)}
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 500px at 50% 0,rgba(0,212,255,.1),transparent 60%),var(--navy)}
.gate-card{width:340px;max-width:90vw;background:linear-gradient(180deg,var(--card),var(--navy2));
  border:1px solid var(--line);border-radius:16px;padding:36px 30px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.45)}
.gate-logo{width:56px;height:56px;border-radius:14px;margin:0 auto 16px;
  background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;
  justify-content:center;font-weight:800;color:var(--navy);font-size:26px;box-shadow:0 8px 28px rgba(0,212,255,.4)}
.gate-card h2{font-size:20px;font-weight:700}
.gate-card p{color:var(--mut);font-size:12.5px;margin:4px 0 22px}
#gateForm{display:flex;flex-direction:column;gap:12px}
#gatePwd{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:9px;padding:12px 14px;
  color:var(--ink);font-size:14px;font-family:inherit;outline:none;transition:border .2s}
#gatePwd:focus{border-color:var(--cyan)}
#gateBtn{background:linear-gradient(135deg,var(--cyan),var(--green));color:var(--navy);font-weight:700;
  font-size:14px;border:none;border-radius:9px;padding:12px;cursor:pointer;font-family:inherit;transition:opacity .2s}
#gateBtn:hover{opacity:.9} #gateBtn:disabled{opacity:.5;cursor:wait}
.gate-err{color:var(--red);font-size:12px;min-height:16px}
@media(max-width:900px){.g2,.g3,.g13{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <img src="logo-full.png" alt="Alpha Labs" style="width:150px;margin:0 auto 14px;display:block">
    <h2>BI Alpha</h2>
    <p>Painel restrito · acesso privado</p>
    <form id="gateForm" autocomplete="off">
      <input id="gatePwd" type="password" placeholder="Senha de acesso" autocomplete="current-password" autofocus>
      <button type="submit" id="gateBtn">Entrar</button>
      <div id="gateErr" class="gate-err"></div>
    </form>
  </div>
</div>
<div class="wrap" id="dash" style="display:none">
  <header class="top">
    <div class="brand">
      <img src="logo.png" alt="Alpha Labs" class="logo">
      <div>
        <h1>BI Alpha · Produção & Faturamento</h1>
        <div class="sub">Inteligência sobre exames e receita do laboratório</div>
      </div>
    </div>
    <div class="period" id="period">carregando…</div>
  </header>

  <div class="note-fin" id="noteFin"></div>

  <div id="app"><div class="loading">Carregando dados…</div></div>

  <footer id="foot"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
