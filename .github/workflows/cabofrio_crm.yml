name: Cabo Frio — criar/publicar CRM (isolado da Matriz)

on:
  workflow_dispatch:

jobs:
  cf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: secret.mjs do Cabo Frio (senhas próprias)
        env:
          CRM_PWD:  ${{ secrets.CRM_PWD_CF }}
          DIR_CODE: ${{ secrets.DIR_CODE_CF }}
          FIN_KEY:  ${{ secrets.FIN_KEY_CF }}
          ELEVEN_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('site_crm/functions/secret.mjs','export const SECRET='+JSON.stringify(process.env.CRM_PWD||'')+';\nexport const DIR_CODE='+JSON.stringify(process.env.DIR_CODE||'')+';\nexport const FIN_KEY='+JSON.stringify(process.env.FIN_KEY||'')+';\nexport const ELEVEN_KEY='+JSON.stringify(process.env.ELEVEN_KEY||'')+';\n')"
          cd site_crm/functions && npm init -y >/dev/null 2>&1 && npm install @netlify/blobs >/dev/null 2>&1 && echo "func pronta"

      - name: Marca "Cabo Frio" (isola visualmente da Matriz)
        run: |
          sed -i 's/Matriz/Cabo Frio/g' site_crm/index.html   # troca TODA marca (título, header e h1 do login)
          STAMP="v $(TZ='America/Sao_Paulo' date +'%d/%m %Hh%M') · CF · $(git rev-parse --short HEAD)"
          sed -i "s#__BUILD_VER__#$STAMP#g" site_crm/index.html   # SELO DE VERSÃO (de-para Você×Fábio)
          echo "selo -> $STAMP"
          V=$(date +%s)
          sed -i "s#\(src=\"app\.js\)\"#\1?v=$V\"#g; s#\(src=\"gate-crypto\.js\)\"#\1?v=$V\"#g" site_crm/index.html

      - name: Renomear (URL bonita) + publicar
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          CF_SITE: ${{ secrets.CRM_SITE_ID_CF }}
        run: |
          set -e
          CLI="npx --yes netlify-cli@26"
          SID="$CF_SITE"
          # tenta deixar a URL bonita (se o nome estiver livre)
          $CLI api updateSite --data "{\"site_id\":\"$SID\",\"body\":{\"name\":\"agente-crm-cabofrio\"}}" >/dev/null 2>&1 && echo "URL renomeada" || echo "nome ocupado — mantém a atual"
          echo "==== CABO FRIO SITE ID = $SID ===="
          $CLI deploy --prod --dir=site_crm --functions=site_crm/functions --site="$SID"
