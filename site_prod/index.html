<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção · Lab Alpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0A1628;--navy2:#0F2138;--card:#10243d;--line:rgba(0,212,255,.18);
  --ink:#F5F7FA;--mut:#8aa2bd;--cyan:#00D4FF;--green:#00E5A0;--amber:#FFB020;--red:#FF5470;--purple:#A78BFA;
  --grid:rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:
   radial-gradient(1400px 700px at 85% -10%,rgba(0,212,255,.08),transparent 60%),
   radial-gradient(1200px 600px at -10% 10%,rgba(0,229,160,.06),transparent 55%),var(--navy);
  color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
/* topbar */
.bar{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--green));
  display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--navy);font-size:26px;box-shadow:0 6px 24px rgba(0,212,255,.4)}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand .sb{color:var(--mut);font-size:13px;font-weight:500;margin-top:3px;letter-spacing:.16em;text-transform:uppercase}
.barright{display:flex;align-items:center;gap:26px}
.clock{text-align:right}
.clock .t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.clock .d{color:var(--mut);font-size:13px;text-transform:capitalize}
.refresh{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(0,229,160,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,229,160,.5)}70%{box-shadow:0 0 0 9px rgba(0,229,160,0)}100%{box-shadow:0 0 0 0 rgba(0,229,160,0)}}
/* layout */
.stage{height:calc(100vh - 90px);padding:18px 30px 22px;display:grid;
  grid-template-columns:repeat(4,1fr);grid-template-rows:auto 1fr 1fr;gap:16px}
.hero{grid-column:span 1;background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);
  border-radius:16px;padding:18px 22px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cyan)}
.hero.g::before{background:var(--green)}.hero.a::before{background:var(--amber)}.hero.p::before{background:var(--purple)}
.hero .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700}
.hero .big{font-size:54px;font-weight:900;letter-spacing:-.03em;line-height:1;margin-top:6px}
.hero .big.md{font-size:42px}
.hero .meta{font-size:13.5px;color:var(--mut);margin-top:8px;font-weight:500}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:30px;margin-top:8px}
.badge.up{background:rgba(0,229,160,.14);color:var(--green)}
.badge.down{background:rgba(255,84,112,.14);color:var(--red)}
.card{background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;display:flex;flex-direction:column;min-height:0}
.card h3{font-size:14px;font-weight:700;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.card h3 .tag{font-size:11px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.card .body{flex:1;position:relative;min-height:0;margin-top:10px}
.span2{grid-column:span 2}
.lst{display:flex;flex-direction:column;gap:0;overflow:hidden}
.lst .it{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:14px}
.lst .it .rk{width:22px;height:22px;border-radius:7px;background:rgba(0,212,255,.12);color:var(--cyan);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lst .it .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .it .q{font-weight:800;font-variant-numeric:tabular-nums}
.lst .it .ci{color:var(--mut);font-size:11.5px}
/* gate */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 500px at 50% 0,rgba(0,212,255,.1),transparent 60%),var(--navy)}
.gate-card{width:360px;max-width:90vw;background:linear-gradient(180deg,var(--card),var(--navy2));
  border:1px solid var(--line);border-radius:18px;padding:40px 32px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.gate-logo{width:60px;height:60px;border-radius:15px;margin:0 auto 18px;background:linear-gradient(135deg,var(--cyan),var(--green));
  display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--navy);font-size:30px}
.gate-card h2{font-size:22px;font-weight:800}.gate-card p{color:var(--mut);font-size:13px;margin:5px 0 24px}
#gateForm{display:flex;flex-direction:column;gap:13px}
#gatePwd{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:13px 15px;color:var(--ink);font-size:15px;font-family:inherit;outline:none}
#gatePwd:focus{border-color:var(--cyan)}
#gateBtn{background:linear-gradient(135deg,var(--cyan),var(--green));color:var(--navy);font-weight:800;font-size:15px;border:none;border-radius:10px;padding:13px;cursor:pointer;font-family:inherit}
.gate-err{color:var(--red);font-size:12.5px;min-height:16px}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">α</div>
    <h2>Painel de Produção</h2>
    <p>Acesso da equipe</p>
    <form id="gateForm" autocomplete="off">
      <input id="gatePwd" type="password" placeholder="Senha da equipe" autocomplete="current-password" autofocus>
      <button type="submit" id="gateBtn">Entrar</button>
      <div id="gateErr" class="gate-err"></div>
    </form>
  </div>
</div>

<div id="tv" style="display:none">
  <div class="bar">
    <div class="brand">
      <div class="logo">α</div>
      <div><h1>Produção · Laboratório Alpha</h1><div class="sb">Painel operacional em tempo quase real</div></div>
    </div>
    <div class="barright">
      <div class="refresh"><span class="dot"></span><span id="upd">—</span></div>
      <div class="clock"><div class="t" id="clk">--:--</div><div class="d" id="dat">—</div></div>
    </div>
  </div>
  <div class="stage" id="stage"></div>
</div>
<script src="app.js"></script>
</body>
</html>
