<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11151a">
<title>Movimento das Rotas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Movimento">
<link rel="stylesheet" href="op.css?v=3">
</head>
<body data-palette="#2a78d6,#eb6834">

<header class="topo">
  <div>
    <h1>Movimento das rotas</h1>
    <p class="sub" id="sub">carregando…</p>
  </div>
  <button id="btTema" class="ico" title="claro / escuro" aria-label="alternar tema">◐</button>
</header>

<!-- ENTRAR -->
<form id="login" class="cartao" hidden>
  <label for="nome">Quem é você</label>
  <select id="nome"><option value="">— escolha —</option></select>
  <label for="senha">Senha (a mesma do Quadro de Inclusões)</label>
  <input id="senha" type="password" autocomplete="current-password">
  <button class="bt" type="submit">Entrar</button>
  <p class="erro" id="erroLogin" hidden></p>
</form>

<main id="painel" hidden>

  <!-- número herói -->
  <section class="cartao heroi">
    <p class="rot">exames no último dia com movimento</p>
    <p class="numero" id="heroiN">—</p>
    <p class="heroiDia" id="heroiDia"></p>
    <div class="deltas" id="deltas"></div>
  </section>

  <!-- dia a dia -->
  <section class="cartao">
    <div class="cabG">
      <h2>Dia a dia</h2>
      <div class="filtros" role="group" aria-label="período">
        <button class="chip on" data-dias="14">14 dias</button>
        <button class="chip" data-dias="30">30 dias</button>
        <button class="chip" data-dias="90">tudo</button>
      </div>
    </div>
    <p class="legenda">
      <span class="lg"><i class="sw s1"></i>dia útil</span>
      <span class="lg"><i class="sw s2"></i>domingo</span>
      <span class="lg lgv">▲ subiu</span>
      <span class="lg lgb">▼ caiu</span>
    </p>
    <div class="grafico" id="gDia"></div>
    <button class="verTabela" data-tab="tDia">ver como tabela</button>
    <div class="tabela" id="tDia" hidden></div>
  </section>

  <!-- por rota -->
  <section class="cartao">
    <h2>Por rota <span class="miudo" id="rotaDia"></span></h2>
    <div class="grafico barrasH" id="gRota"></div>
    <button class="verTabela" data-tab="tRota">ver como tabela</button>
    <div class="tabela" id="tRota" hidden></div>
  </section>

  <!-- domingo -->
  <section class="cartao" id="secDomingo" hidden>
    <h2>Domingo <span class="miudo">série separada</span></h2>
    <p class="nota" id="notaDom"></p>
    <div class="grafico" id="gDom"></div>
  </section>

  <!-- por motoboy -->
  <section class="cartao" id="secMb" hidden>
    <h2>Por motoboy <span class="miudo" id="mbDia"></span></h2>
    <div class="grafico barrasH" id="gMb"></div>
  </section>

  <p class="rodape" id="rodape"></p>
</main>

<script>
/* 📲 No iPhone não existe botão de instalar: o caminho é Compartilhar → rolar →
   Adicionar à Tela de Início, e ninguém descobre isso sozinho. Aviso uma vez. */
;(()=>{const app=matchMedia('(display-mode: standalone)').matches||navigator.standalone
let vi=false; try{vi=localStorage.getItem('op_convite')==='1'}catch{}
if(app||vi) return
addEventListener('load',()=>{ if(document.querySelector('#painel').hidden) return
  const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)
  const d=document.createElement('div'); d.className='cartao'
  d.style.cssText='border-color:var(--s2)'
  d.innerHTML=`<p style="margin:0 0 8px;font-weight:600;font-size:13.5px">📲 Deixe como app no celular</p>
  <p style="margin:0 0 10px;font-size:12.5px;color:var(--tinta-2);line-height:1.5">${iOS
    ? 'Toque em <b>Compartilhar</b> (o quadradinho com a seta pra cima), <b>role a lista para baixo</b> e toque em <b>Adicionar à Tela de Início</b>.'
    : 'Abra o menu do navegador (⋮) e toque em <b>Instalar aplicativo</b>.'}</p>
  <button class="chip" id="opVi">entendi, não mostrar mais</button>`
  document.querySelector('#painel').appendChild(d)
  d.querySelector('#opVi').onclick=()=>{ try{localStorage.setItem('op_convite','1')}catch{}; d.remove() }
})})()
</script>
<script src="op.js?v=4"></script>
</body>
</html>
