<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente CRM — Matriz · Alpha Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="skin.css">
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  /* ---- ajustes específicos do Agente CRM (sobre a skin) ---- */
  .wrap{max-width:1320px;margin:0 auto;padding:0 24px 60px}
  .brand .sb .fleet{color:var(--cyan)}
  .clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--mut);font-size:13px}
  .topright{display:flex;align-items:center;gap:14px}

  /* hero RADAR DE REATIVAÇÃO */
  .radar{display:flex;align-items:center;gap:22px;border-radius:16px;padding:18px 26px;margin:18px 0 6px;
    border:2px solid #fff;animation:urgblink .9s steps(1,end) infinite}
  .radar .ico{font-size:40px;animation:sirene .9s ease-in-out infinite}
  .radar .big{font-size:46px;font-weight:900;color:#fff;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
  .radar .lbl{font-size:15px;font-weight:800;color:#fff;letter-spacing:.02em;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .radar .sub{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:2px}
  .radar.calm{animation:none;background:linear-gradient(90deg,rgba(0,229,160,.25),rgba(0,212,255,.18));border-color:rgba(0,229,160,.5)}
  .radar.calm .ico{animation:none}
  .radar .ring,.hero .ring{flex:0 0 auto}
  @media(max-width:720px){
    .radar{flex-wrap:wrap;justify-content:center;text-align:center;gap:14px}
    .radar .big{font-size:40px}
    .radar>div:nth-child(3){flex:1 1 100%}
    .crow{grid-template-columns:28px 1fr;gap:8px}
    .crow .mid{grid-column:2;justify-content:flex-start}
    .crow .acao,.crow .pr{grid-column:2;justify-self:start}
  }

  .kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
  .hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;margin:6px 0 14px}
  @media(max-width:720px){.hero{grid-template-columns:1fr}}

  /* worklist do CRM */
  .crow{display:grid;grid-template-columns:36px 1fr auto auto;gap:14px;align-items:center;
    padding:11px 14px;border-radius:11px;background:linear-gradient(180deg,var(--card),var(--navy2));
    border:1px solid var(--line);margin-bottom:8px}
  .crow .rk{font-size:13px;font-weight:900;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
  .crow .nm{font-weight:800;font-size:15px}
  .crow .ci{font-size:12px;color:var(--mut);margin-top:2px}
  .crow .mid{display:flex;align-items:center;gap:16px}
  .crow .delta{font-size:16px;font-weight:900;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
  .crow .delta.down{color:var(--red)} .crow .delta.up{color:var(--azul)} .crow .delta.flat{color:var(--mut)}
  .crow .acao{font-size:12.5px;font-weight:700;color:var(--ink);background:rgba(255,176,32,.12);
    border:1px solid rgba(255,176,32,.35);border-radius:8px;padding:6px 11px;white-space:nowrap}
  .crow .acao.hot{background:rgba(255,84,112,.14);border-color:rgba(255,84,112,.4);color:#ffb3c0}
  .pr{font-size:10px;font-weight:900;border-radius:6px;padding:2px 8px;letter-spacing:.03em;text-transform:uppercase}
  .pr.parado{background:var(--red);color:#fff}
  .pr.queda_forte{background:#FF2D55;color:#fff}
  .pr.queda{background:rgba(255,84,112,.18);color:#ffb3c0}
  .pr.novo_esfriando{background:var(--amber);color:var(--navy)}
  .pr.alta{background:rgba(77,157,255,.18);color:var(--azul)}
  .pr.parado-sit{background:rgba(255,84,112,.18);color:#ffb3c0}
  .pr.estável{background:rgba(138,162,189,.16);color:var(--mut)}
  .spk{display:block}
  /* botão de follow-up (toggle compartilhado pela equipe) */
  .rcell{display:flex;align-items:center;gap:10px;justify-content:flex-end}
  .fubtn{font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap;
    border-radius:8px;padding:7px 11px;background:transparent;border:1px solid rgba(0,212,255,.45);color:var(--cyan)}
  .fubtn:hover{background:rgba(0,212,255,.1)}
  .fubtn.on{background:var(--green);border-color:var(--green);color:var(--navy)}
  .crow.done{opacity:.62;border-color:rgba(0,229,160,.4)}
  .crow.done .acao{opacity:.5}
  .seclabel{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
  .seclabel::after{content:"";flex:1;height:1px;background:var(--line)}
  .empty{color:var(--mut);font-size:14px;padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  .tabsbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .demo-flag{display:none;font-size:11px;font-weight:800;color:var(--navy);background:var(--amber);border-radius:6px;padding:3px 10px;letter-spacing:.04em}
  .demo-flag.on{display:inline-block}

  /* botão Registrar + último resultado na linha */
  .regbtn{font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap;
    border-radius:8px;padding:7px 11px;background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.5);color:#C4B5FD}
  .regbtn:hover{background:rgba(167,139,250,.26)}
  .lastint{font-size:11.5px;font-weight:700;margin-top:5px;cursor:pointer;color:var(--ink)}
  .lastint:hover{text-decoration:underline}
  /* retorno agendado */
  .rtbadge{display:inline-block;font-size:11px;font-weight:900;border-radius:6px;padding:3px 9px;margin-top:5px;cursor:pointer;letter-spacing:.02em}
  .rtbadge.hoje{background:var(--amber);color:var(--navy)}
  .rtbadge.atrasado{background:var(--red);color:#fff;animation:rtpulse 1.3s ease-in-out infinite}
  @keyframes rtpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,84,112,.5)}50%{box-shadow:0 0 0 5px rgba(255,84,112,0)}}
  .rtbadge.fut{background:rgba(138,162,189,.16);color:var(--mut)}
  .crow.due{border-left:4px solid var(--amber)}
  .crow.due:has(.rtbadge.atrasado){border-left-color:var(--red)}

  /* BI Resultados */
  .bigrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:760px){.bigrid{grid-template-columns:1fr}}
  .cwrap{position:relative;height:230px}
  .funil{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .fstep{display:grid;grid-template-columns:230px 1fr 54px;gap:12px;align-items:center}
  .fstep .fl{font-size:13px;font-weight:700;color:var(--mut)}
  .fstep .fbar{height:18px;background:rgba(255,255,255,.06);border-radius:9px;overflow:hidden}
  .fstep .fbar>div{height:18px;border-radius:9px;min-width:6px;transition:width .5s}
  .fstep .fv{font-size:17px;font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
  @media(max-width:760px){.fstep{grid-template-columns:120px 1fr 44px}.fstep .fl{font-size:11px}}
  .feedrow{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .feedrow .fi{font-size:18px}
  .hi-body{min-width:0}
  .hi-nota{font-size:12.5px;color:var(--mut);font-style:italic;margin-top:3px;line-height:1.4}
  /* histórico semana a semana */
  .histgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:680px){.histgrid{grid-template-columns:1fr}}
  .histhead{font-size:13px;font-weight:800;margin-bottom:8px}
  .histcli{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
  .histcli .nm{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .histcli .pr{flex-shrink:0}
  .monthhead{font-size:17px;font-weight:900;letter-spacing:-.01em;margin:22px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line);color:var(--cyan)}
  .monthhead span{font-size:12.5px;font-weight:600;color:var(--mut)}
  /* clientes sensíveis — pulsante amarelo (telão) */
  .senshead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 6px}
  .sensadd{display:flex;gap:8px;flex-wrap:wrap}
  .sensadd .wlsearch{width:auto}
  .sensgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:14px}
  .senscard{display:flex;align-items:center;gap:14px;border-radius:14px;padding:16px 18px;border:2px solid var(--amber);animation:senspulse 1.1s ease-in-out infinite}
  @keyframes senspulse{0%,100%{background:rgba(255,176,32,.10);box-shadow:0 0 0 0 rgba(255,176,32,.45)}50%{background:rgba(255,176,32,.28);box-shadow:0 0 26px 5px rgba(255,176,32,.45)}}
  .senscard .sc-ic{font-size:30px;line-height:1}
  .senscard .sc-body{flex:1;min-width:0}
  .senscard .sc-nome{font-size:19px;font-weight:900;color:#fff}
  .senscard .sc-obs{font-size:13.5px;color:#ffe2ab;margin-top:3px}
  .senscard .sc-meta{font-size:11px;color:var(--amber);margin-top:5px;opacity:.85}
  .senscard .sc-del{background:transparent;border:none;color:var(--amber);cursor:pointer;font-size:17px;flex-shrink:0}
  @media print{
    #gate,.bar,.tabs,#modal,#foot{display:none!important}
    .regbtn,.fubtn,.rotctl,.demo-flag{display:none!important}
    body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .wrap{padding:0;max-width:none}
    .card,.monthhead,.kpi,.histcli{break-inside:avoid}
  }

  /* modal de registro */
  #modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;
    background:rgba(4,10,20,.72);backdrop-filter:blur(3px);overflow-y:auto;padding:40px 16px}
  .modal-card{width:560px;max-width:96vw;background:linear-gradient(180deg,var(--card),var(--navy2));
    border:1px solid var(--line);border-radius:18px;padding:24px 26px;box-shadow:0 30px 80px rgba(0,0,0,.6);margin:auto}
  .m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .m-cli{font-size:21px;font-weight:900;letter-spacing:-.01em}
  .m-x{background:transparent;border:none;color:var(--mut);font-size:22px;cursor:pointer;line-height:1}
  .m-sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan);margin:20px 0 8px}
  .m-hist{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:rgba(0,0,0,.18)}
  .hist-row{display:grid;grid-template-columns:24px 1fr 26px;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .hist-row:last-child{border-bottom:none}
  .hi-ic{font-size:16px}.hi-top{font-size:13px}.hi-next{font-size:11.5px;color:var(--cyan);margin-top:2px}
  .hi-del{background:transparent;border:none;color:var(--mut);cursor:pointer;font-size:13px}
  .hi-del:hover{color:var(--red)}
  .m-lbl{font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 7px}
  .m-opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border-radius:9px;padding:9px 14px;
    background:var(--card2);border:1px solid var(--line);color:var(--ink)}
  .opt:hover{border-color:rgba(0,212,255,.5)}
  .opt.on{background:rgba(0,212,255,.16);border-color:var(--cyan);color:var(--cyan)}
  .opt.res-positivo.on{background:rgba(0,229,160,.18);border-color:var(--green);color:var(--green)}
  .opt.res-negociacao.on{background:rgba(0,212,255,.16);border-color:var(--cyan);color:var(--cyan)}
  .opt.res-sem_resposta.on{background:rgba(255,176,32,.18);border-color:var(--amber);color:var(--amber)}
  .opt.res-negativo.on{background:rgba(255,84,112,.18);border-color:var(--red);color:#ffb3c0}
  .opt.res-em_andamento.on{background:rgba(167,139,250,.18);border-color:var(--purple);color:#c4b5fd}
  .opt.sat{min-width:40px;justify-content:center;padding:9px 0}
  .opt.enc.on{background:rgba(255,84,112,.16);border-color:var(--red);color:#ffb3c0}
  .m-enc{width:100%;margin-top:14px;background:transparent;border:1px solid var(--red);color:#ffb3c0;font-weight:800;font-size:14px;border-radius:11px;padding:13px;cursor:pointer;font-family:inherit}
  .m-enc:hover{background:rgba(255,84,112,.12)} .m-enc:disabled{opacity:.6;cursor:default}
  .encbanner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(255,84,112,.1);border:1px solid rgba(255,84,112,.35);border-radius:12px;padding:12px 14px}
  .opt.inat.on{background:rgba(255,138,0,.16);border-color:#FF8A00;color:#ffc266}
  .inatbanner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(255,138,0,.1);border:1px solid rgba(255,138,0,.35);border-radius:12px;padding:12px 14px}
  .inatrow{display:flex;align-items:center;gap:12px;margin:7px 0}
  .inatlbl{flex:0 0 150px;font-size:13.5px;font-weight:600}
  .inatbar{flex:1;height:12px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden}
  .inatbar>div{height:100%;background:linear-gradient(90deg,#FF8A00,#FFB020);border-radius:6px}
  .inatpct{flex:0 0 76px;text-align:right;font-size:13.5px;font-weight:800;color:#ffc266}
  .classhead{display:flex;align-items:center;gap:8px;margin:10px 0 5px 2px;font-size:13px;font-weight:700}
  .complist{display:flex;flex-wrap:wrap;gap:8px}
  .comp-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #888;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.03)}
  .bigmic{width:100%;background:linear-gradient(135deg,#00D4FF,#00E5A0);color:#06121f;font-weight:800;font-size:18px;border:none;border-radius:14px;padding:18px;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(0,212,255,.25);margin-bottom:14px}
  .bigmic:active{transform:scale(.99)}
  .micbtn{flex:0 0 96px;background:rgba(0,212,255,.12);border:1px solid var(--cyan);color:var(--cyan);font-weight:800;font-size:13px;border-radius:10px;cursor:pointer;font-family:inherit;padding:8px}
  .micbtn.rec{background:rgba(255,84,112,.18);border-color:var(--red);color:#ffb3c0;animation:micpulse 1s ease-in-out infinite}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,84,112,.5)}50%{box-shadow:0 0 0 8px rgba(255,84,112,0)}}
  .repbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .repsel{flex:1;min-width:140px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;outline:none}
  .repsel:focus{border-color:var(--cyan)}
  .subtabs{display:flex;gap:8px;margin-bottom:14px}
  .subtab{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--mut);font-weight:700;font-size:14px;border-radius:10px;padding:11px;cursor:pointer;font-family:inherit}
  .subtab.on{background:rgba(0,212,255,.14);border-color:var(--cyan);color:var(--cyan)}
  .retday-h{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .retbairro{font-size:13px;font-weight:700;color:#9fd8ff;margin:8px 0 2px}
  .repagenda{margin-bottom:20px}
  .repagenda-h{font-size:15px;font-weight:800;color:var(--cyan);margin:8px 0 10px;border-bottom:1px solid rgba(0,212,255,.25);padding-bottom:7px}
  .retday-card.retday-pulse{animation:ypulse 1s ease-in-out infinite}
  .retday-card.retday-hoje{animation:ypulse .65s ease-in-out infinite;border-color:#FFD000!important}
  .retday-card.retday-late{border-color:rgba(255,45,85,.5)!important;background:rgba(255,45,85,.05)}
  @keyframes ypulse{0%,100%{box-shadow:0 0 0 0 rgba(255,208,0,0);background:rgba(255,208,0,.05)}50%{box-shadow:0 0 0 5px rgba(255,208,0,.4);background:rgba(255,208,0,.16)}}
  .rota-inc{background:rgba(255,45,85,.16);border:2px solid #FF2D55;color:#ffb3c0;font-weight:800;font-size:14px;border-radius:10px;padding:12px 14px;margin:6px 0 10px;line-height:1.4;animation:micpulse 1.3s ease-in-out infinite}
  .rota-ok{background:rgba(0,229,160,.12);border:1px solid rgba(0,229,160,.4);color:#7effcf;font-weight:700;font-size:13px;border-radius:10px;padding:9px 12px;margin:6px 0 10px}
  .proxhint{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.35);color:#9fe6ff;font-size:12.5px;border-radius:9px;padding:8px 11px;margin-top:8px}
  .checkinbtn{width:100%;background:rgba(255,138,0,.14);border:1px solid #FF8A00;color:#ffc266;font-weight:800;font-size:15px;border-radius:11px;padding:13px;cursor:pointer;font-family:inherit;margin-top:4px}
  .checkinbtn.done{background:rgba(0,229,160,.14);border-color:#00E5A0;color:#7effcf}
  .checkinbtn:disabled{opacity:.6}
  .semret{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink);cursor:pointer;background:rgba(255,138,0,.08);border:1px solid rgba(255,138,0,.3);border-radius:9px;padding:9px 11px}
  .semret input{width:18px;height:18px;accent-color:#FF8A00}
  .delfb{background:transparent;border:none;color:#ff8098;font-size:16px;cursor:pointer;padding:2px 6px;margin-left:6px}
  .delfb:hover{color:#FF2D55}
  .legenda{display:flex;flex-direction:column;gap:7px}
  .leg-row{display:flex;align-items:center;gap:8px;font-size:13.5px}
  .leg-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
  .leg-n{font-weight:800;margin-left:2px;min-width:28px}
  .m-ta{width:100%;min-height:80px;resize:vertical;background:rgba(0,0,0,.25);border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;color:var(--ink);font-family:inherit;font-size:14px;outline:none}
  .m-ta:focus{border-color:var(--cyan)}
  .m-date{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--ink);font-family:inherit;font-size:14px;outline:none;color-scheme:dark}
  .m-save{width:100%;margin-top:20px;background:linear-gradient(135deg,var(--cyan),var(--green));color:var(--navy);
    font-weight:800;font-size:15px;border:none;border-radius:11px;padding:14px;cursor:pointer;font-family:inherit}
  .m-save:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>

<!-- ===== GATE (senha do time CRM) ===== -->
<div id="gate">
  <form id="gateForm" class="gate-card">
    <img src="logo-full.png" alt="Alpha Labs" style="height:120px;margin-bottom:18px">
    <div style="font-weight:900;font-size:19px;letter-spacing:-.01em">Agente CRM — Matriz</div>
    <div style="color:var(--mut);font-size:12px;margin:4px 0 20px;letter-spacing:.14em;text-transform:uppercase">Agentes de IA Alpha</div>
    <input id="gatePwd" type="password" placeholder="Senha do time CRM" autocomplete="current-password" autofocus>
    <button id="gateBtn" type="submit">Entrar</button>
    <button type="button" id="gateBio" style="display:none;width:100%;margin-top:9px;background:transparent;border:1px solid var(--line,rgba(255,255,255,.15));color:var(--ink,#eef);font-weight:700;font-size:14px;border-radius:10px;padding:11px;cursor:pointer;font-family:inherit">👆 Entrar com digital</button>
    <div id="gateErr" class="gate-err"></div>
  </form>
</div>
<button id="bioSetup" style="display:none;position:fixed;right:14px;bottom:14px;z-index:30;background:rgba(10,22,40,.92);border:1px solid var(--line,rgba(255,255,255,.15));color:var(--ink,#eef);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">👆 Proteger com digital</button>

<!-- ===== APP ===== -->
<div id="app" style="display:none">
  <div class="bar">
    <div class="brand">
      <img class="logo" src="logo.png" alt="Alpha Labs">
      <div>
        <h1>Agente CRM <span style="color:var(--cyan)">·</span> Matriz</h1>
