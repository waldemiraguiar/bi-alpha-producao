name: Atualiza Painel Financeiro

on:
  schedule:
    - cron: '0 9-23/2 * * *'   # a cada 2h em horário útil BRT (~6h-20h) — BI admin não precisa de tempo real (era */30 24h). workflow_dispatch p/ atualizar na hora.
  workflow_dispatch:

concurrency:
  group: atualiza-financeiro
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  atualiza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install --quiet pymysql cryptography
      - name: Gerar e cifrar dados financeiros
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PWD:  ${{ secrets.MYSQL_PWD }}
          MYSQL_DB:   ${{ secrets.MYSQL_DB }}
          BI_PWD:     ${{ secrets.BI_PWD }}
        run: python build_financeiro.py
      - name: Config + dependências da função (e-mail renegociação)
        env:
          BI_PWD:             ${{ secrets.BI_PWD }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
        run: |
          node -e "const fs=require('fs');const q=s=>JSON.stringify(s||'');const e=process.env;fs.writeFileSync('site/functions/secret.mjs',['export const SECRET='+q(e.BI_PWD),'export const GMAIL_USER='+q(e.GMAIL_USER),'export const GMAIL_APP_PASSWORD='+q(e.GMAIL_APP_PASSWORD),'export const EMAIL_TO='+q(e.EMAIL_TO||e.GMAIL_USER)].join(';\n')+';\n')"
          cd site/functions && npm install >/dev/null 2>&1 && echo "func e-mail pronta"
      - name: Publicar no Netlify (site admin)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes netlify-cli@26 deploy --prod --dir=site --functions=site/functions --site=${{ secrets.FIN_SITE_ID }}
