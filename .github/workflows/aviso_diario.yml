name: Aviso diário 7h (briefing — e-mail + WhatsApp)

on:
  schedule:
    - cron: '0 10 * * *'    # 10:00 UTC = 07:00 BRT — TODO dia (domingo a domingo)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  aviso:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet cryptography
      - name: Enviar briefing diário
        env:
          CRM_PWD: ${{ secrets.CRM_PWD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python aviso_diario_crm.py
