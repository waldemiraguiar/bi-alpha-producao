<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção · Lab Alpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1628;--navy2:#0F2138;--card:#10243d;--card2:#13294a;--line:rgba(0,212,255,.18);
  --ink:#F5F7FA;--mut:#8aa2bd;--cyan:#00D4FF;--green:#00E5A0;--amber:#FFB020;--red:#FF5470;--purple:#A78BFA;--petlove:#FF6AD5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:
  radial-gradient(1400px 700px at 85% -10%,rgba(0,212,255,.08),transparent 60%),
  radial-gradient(1200px 600px at -10% 10%,rgba(0,229,160,.06),transparent 55%),var(--navy);
  color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.logo{height:52px;width:auto;object-fit:contain;display:block}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand .sb{color:var(--mut);font-size:12px;font-weight:600;margin-top:3px;letter-spacing:.14em;text-transform:uppercase}
.barright{display:flex;align-items:center;gap:22px}
.clock{text-align:right}.clock .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.clock .d{color:var(--mut);font-size:12px;text-transform:capitalize}
.refresh{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,229,160,.5)}70%{box-shadow:0 0 0 9px rgba(0,229,160,0)}100%{box-shadow:0 0 0 0 rgba(0,229,160,0)}}
/* tabs */
.tabs{display:flex;gap:9px;padding:13px 28px 0;flex-wrap:wrap}
.tab{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px 10px 0 0;padding:9px 15px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .2s;overflow:hidden}
.tab:hover{background:var(--card2)}
.tab.on{background:var(--card2);border-bottom-color:transparent}
.tab .tn{font-size:13.5px;font-weight:700}
.tab.on .tn{color:var(--cyan)}
.tab .tb{font-size:11px;font-weight:800;background:rgba(255,255,255,.08);border-radius:20px;padding:1px 8px;font-variant-numeric:tabular-nums}
.tab .tb.late{background:rgba(255,84,112,.18);color:var(--red)}
.tab .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--cyan);width:0}
.rotctl{align-self:center;margin-left:auto;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:6px 13px;background:var(--card);white-space:nowrap}
.rotctl:hover{background:var(--card2)}
.rotctl.pinned{color:var(--amber);border-color:rgba(255,176,32,.5);background:rgba(255,176,32,.08)}
/* aba EXAMES URGENTES (destacada) */
.tab.urgtab{border-color:rgba(255,176,32,.6);background:rgba(255,176,32,.12)}
.tab.urgtab .tn{color:var(--amber);font-weight:800}
.tab.urgtab.on{background:rgba(255,176,32,.22)}
.tab .tb.urgb{background:var(--amber);color:var(--navy)}
.hcat.urgcat{border-color:rgba(255,176,32,.5);background:linear-gradient(180deg,rgba(255,176,32,.14),var(--navy2))}
.tab.pettab{border-color:rgba(255,106,213,.6);background:rgba(255,106,213,.12)}
.tab.pettab .tn{color:var(--petlove);font-weight:800}
.tab.pettab.on{background:rgba(255,106,213,.22)}
.tab .tb.petb{background:var(--petlove);color:#fff}
.hcat.petcat{border-color:rgba(255,106,213,.5);background:linear-gradient(180deg,rgba(255,106,213,.14),var(--navy2))}
.tab.atrastab{border-color:rgba(255,84,112,.6);background:rgba(255,84,112,.12)}
.tab.atrastab .tn{color:#FF8A8A;font-weight:800} .tab.atrastab.on{background:rgba(255,84,112,.22)}
.tab .tb.atrasb{background:var(--red);color:#fff}
.hcat.atrascat{border-color:rgba(255,84,112,.5);background:linear-gradient(180deg,rgba(255,84,112,.16),var(--navy2))}
.wlsearch{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:8px;padding:6px 11px;color:var(--ink);font-size:12.5px;font-family:inherit;outline:none;width:240px;font-weight:600}
.wlsearch:focus{border-color:var(--cyan)}
.wlsearch::placeholder{color:var(--mut)}
/* paciente PET LOVE (destaque) */
.wl .pac.petlove{color:var(--petlove)}
.plove{display:inline-block;font-size:9.5px;font-weight:900;color:#fff;background:var(--petlove);border-radius:5px;padding:1px 6px;margin-left:7px;letter-spacing:.04em}
.tab.on .prog{transition:width linear}
/* content */
.content{height:calc(100vh - 64px - 52px);padding:14px 28px 20px;display:flex;flex-direction:column;gap:14px;min-height:0}
.content.locked{height:calc(100vh - 64px)}
.cgrid{flex:1;display:grid;grid-template-columns:340px 1fr;gap:18px;min-height:0}
.urgbanner{display:flex;align-items:center;gap:18px;border-radius:12px;padding:15px 22px;
  border:2px solid #fff;animation:urgblink .65s steps(1,end) infinite}
@keyframes urgblink{
  0%{background:linear-gradient(90deg,#FF2D55,#FF8A00);box-shadow:0 0 34px 5px rgba(255,45,85,.7),inset 0 0 0 9999px rgba(255,255,255,.02)}
  50%{background:linear-gradient(90deg,#FF8A00,#FF2D55);box-shadow:0 0 12px 0 rgba(255,138,0,.4)}}
.urgbanner .ico{font-size:32px;line-height:1;animation:sirene .65s ease-in-out infinite}
@keyframes sirene{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.3) rotate(6deg)}}
.urgbanner .ttl{font-weight:900;color:#fff;font-size:25px;white-space:nowrap;letter-spacing:.03em;text-shadow:0 2px 5px rgba(0,0,0,.45)}
.urgbanner .ul{display:flex;gap:10px;overflow:hidden;flex:1}
.urgbanner .u{font-size:13px;white-space:nowrap;color:#fff;font-weight:700;background:rgba(0,0,0,.22);padding:4px 10px;border-radius:8px}
.urgbanner .u .r{color:#0A1628;font-weight:900;background:#fff;padding:0 6px;border-radius:4px;margin-right:5px}
.wl .urg{display:inline-block;font-size:9.5px;font-weight:900;color:var(--navy);background:var(--amber);border-radius:5px;padding:1px 6px;margin-left:7px;vertical-align:middle;letter-spacing:.04em}
.hero{display:flex;flex-direction:column;gap:14px;min-height:0}
.hcat{background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.hcat .nm{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.hcat .sla{display:inline-block;margin-top:8px;font-size:12px;color:var(--cyan);font-weight:700;border:1px solid var(--line);padding:3px 10px;border-radius:20px}
.ringwrap{display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:16px;padding:20px}
.ring{width:168px;height:168px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ring::before{content:'';position:absolute;inset:15px;border-radius:50%;background:#0c1f38}
.ring .rv{position:relative;text-align:center}
.ring .rv .big{font-size:42px;font-weight:900;line-height:1}
.ring .rv .lb{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.mini::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.mini.proc::before{background:var(--cyan)}.mini.late::before{background:var(--red)}.mini.tat::before{background:var(--purple)}
.mini .v{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1}
.mini .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:3px}
.right{display:grid;grid-template-rows:auto 1fr;gap:16px;min-height:0}
.card{background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-height:0;display:flex;flex-direction:column}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card h3 .tag{font-size:11px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
/* derivações tiles */
.ders{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;overflow-y:auto;max-height:230px;padding-right:4px}
.der{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.der .de{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.der .row{display:flex;justify-content:space-between;align-items:baseline}
.der .pv{font-size:26px;font-weight:900;line-height:1}
.der .pl{font-size:10px;color:var(--mut);text-transform:uppercase;font-weight:700}
.der .lb{font-size:12px;font-weight:800}
.der .bar{height:7px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;display:flex;margin-top:9px}
.der .bar>div{height:7px;flex:0 0 auto}
.der .bar .ok{background:var(--green)}.der .bar .bad{background:var(--red)}
/* worklist */
.scroll{overflow-y:auto;min-height:0}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:3px}
.wl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.wl .reg{font-size:12.5px;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums;white-space:nowrap}
.wl .pac{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .exm{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .db{font-size:12px;font-weight:800;border-radius:7px;padding:3px 9px;white-space:nowrap}
.wl .db.ok{background:rgba(0,229,160,.13);color:var(--green)}.wl .db.late{background:rgba(255,84,112,.14);color:var(--red)}
.wl .wlact{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.urgbtn{background:transparent;border:1px solid rgba(255,176,32,.55);color:var(--amber);border-radius:7px;padding:3px 9px;font-size:14px;cursor:pointer;line-height:1}
.urgbtn:hover{background:rgba(255,176,32,.18)}
.urgbtn.on{background:var(--amber);border-color:var(--amber)}
.baixabtn{background:transparent;border:1px solid rgba(0,229,160,.55);color:var(--green);border-radius:7px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;line-height:1;white-space:nowrap}
.baixabtn:hover{background:rgba(0,229,160,.16)}
.desfazbtn{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:7px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.desfazbtn:hover{background:rgba(255,255,255,.06);color:var(--ink)}
/* gate */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 50% 0,rgba(0,212,255,.1),transparent 60%),var(--navy)}
.gate-card{width:360px;max-width:90vw;background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:18px;padding:40px 32px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.gate-logo{width:60px;height:60px;border-radius:15px;margin:0 auto 18px;background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--navy);font-size:30px}
.gate-card h2{font-size:22px;font-weight:800}.gate-card p{color:var(--mut);font-size:13px;margin:5px 0 24px}
#gateForm{display:flex;flex-direction:column;gap:13px}
#gatePwd{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:13px 15px;color:var(--ink);font-size:15px;font-family:inherit;outline:none}
#gatePwd:focus{border-color:var(--cyan)}
#gateBtn{background:linear-gradient(135deg,var(--cyan),var(--green));color:var(--navy);font-weight:800;font-size:15px;border:none;border-radius:10px;padding:13px;cursor:pointer;font-family:inherit}
.gate-err{color:var(--red);font-size:12.5px;min-height:16px}
/* ===== modo SEPARAÇÃO ===== */
.modesw{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
.msbtn{background:transparent;border:0;color:var(--mut);font-weight:700;font-size:13px;padding:7px 13px;border-radius:7px;cursor:pointer;font-family:inherit}
.msbtn.on{background:var(--card2);color:var(--cyan)}
.msbtn.alt.on{color:var(--green)}
.sep{height:calc(100vh - 90px);padding:14px 28px 18px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.sephead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.septabs{display:flex;gap:8px;flex-wrap:wrap}
.septab{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 15px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:8px}
.septab .c{font-size:11px;font-weight:800;background:rgba(255,255,255,.08);border-radius:20px;padding:1px 8px}
.septab.on{background:var(--card2);border-color:var(--cyan);color:var(--cyan)}
.septab.andon.on{border-color:var(--red);color:var(--red)} .septab.andon .c{background:var(--red);color:#fff}
.sepme{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.sepme select{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font-family:inherit;font-weight:700;font-size:13px;outline:none}
.sepme select:focus{border-color:var(--cyan)}
.adminbtn{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:7px 11px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
.adminbtn:hover{background:var(--card2)}
.adminbtn.on{color:var(--green);border-color:rgba(0,229,160,.5);background:rgba(0,229,160,.08)}
.catstrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.topicwrap{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.topicgrp{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.topiclbl{font-size:11px;font-weight:800;color:var(--cyan);text-transform:uppercase;letter-spacing:.03em;min-width:172px;flex:0 0 auto;padding-top:9px}
.topicgrp .catstrip{margin-bottom:0;flex:1}
.sepcat.atrasocard{border:1px solid rgba(255,176,32,.5);box-shadow:0 0 18px 1px rgba(255,176,32,.12)}
.sepcat.atrasocard>.h{color:var(--amber)}
/* ATRASADOS / URGENTE — atenção máxima (vermelho piscante + fogos) */
.andonbar.urg{position:relative;overflow:hidden;animation:flashred .4s steps(1,end) infinite;border:2px solid #fff;justify-content:center;gap:12px}
.andonbar.urg .ttl{font-size:24px;text-align:center}
@keyframes fwpop{0%{transform:scale(.4) rotate(-12deg);opacity:.35}45%{transform:scale(1.6) rotate(12deg);opacity:1}100%{transform:scale(.85) rotate(0);opacity:.6}}
.andonbar.urg .fw1,.andonbar.urg .fw2,.andonbar.urg .fw3{font-size:32px;line-height:1;display:inline-block;animation:fwpop .65s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
.andonbar.urg .fw2{animation-delay:.2s;font-size:36px}
.andonbar.urg .fw3{animation-delay:.42s}
.sepcat.andon.urgmax{animation:flashred .4s steps(1,end) infinite;border:3px solid #fff}
.sepcat.andon.urgmax>.h{color:#fff;font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.septab.urgpulse{animation:tabpulse .5s ease-in-out infinite}
@keyframes tabpulse{0%,100%{background:rgba(255,45,85,.25);box-shadow:0 0 0 0 rgba(255,45,85,.65)}50%{background:rgba(255,45,85,.5);box-shadow:0 0 0 7px rgba(255,45,85,0)}}
.septab.urgpulse .tn,.septab.urgpulse{color:#FF5470!important}
.catpill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink)}
.catpill:hover{background:var(--card2)}
.catpill.on{background:var(--card2);border-color:var(--cyan);color:var(--cyan)}
.catpill.haslate.on{border-color:var(--red);color:var(--red)}
.catpill .cc{font-size:11px;font-weight:800;background:rgba(255,255,255,.08);border-radius:20px;padding:1px 8px}
.catpill .cc.late{background:var(--red);color:#fff}
.sepbody{flex:1;overflow-y:auto;min-height:0;padding-right:6px}
.sepbody::-webkit-scrollbar{width:7px}.sepbody::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:3px}
.sepcat{margin-bottom:14px;background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sepcat>.h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;font-weight:800;font-size:15px}
.sepcat>.h .cnt{font-size:12px;font-weight:600;color:var(--mut)}
.seprow{display:grid;grid-template-columns:104px 1fr auto;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid rgba(255,255,255,.05)}
.seprow .req{font-weight:800;color:var(--cyan);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.seprow .req .y{color:var(--mut);font-weight:600;font-size:11px}
.seprow .pac{font-size:15px;font-weight:700}
.seprow .meta{font-size:11.5px;color:var(--mut);margin-top:2px}
.seprow .meta b{color:var(--ink);font-weight:600}
.cl{display:inline-block;font-size:10px;font-weight:800;border-radius:5px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.cl.interno{background:rgba(0,212,255,.16);color:var(--cyan)}
.cl.apoio{background:rgba(255,176,32,.18);color:var(--amber)}
.seprow .right2{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.dl{font-size:11px;font-weight:700;border-radius:7px;padding:3px 9px;white-space:nowrap}
.dl.ok{background:rgba(0,229,160,.12);color:var(--green)}
.dl.late{background:rgba(255,84,112,.16);color:var(--red)}
.dl.done{background:rgba(255,255,255,.06);color:var(--mut)}
.sepbtn{border:0;border-radius:8px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.sepbtn.go{background:var(--green);color:#04221a}
.sepbtn.env{background:var(--amber);color:#2a1c00}
.sepbtn.rec{background:var(--cyan);color:#04222e}
.sepbtn.undo{background:transparent;border:1px solid var(--line);color:var(--mut);font-weight:700}
.donerow{opacity:.7}
.byline{font-size:11px;color:var(--green);font-weight:700;white-space:nowrap}
.urg2{display:inline-block;font-size:9.5px;font-weight:900;color:var(--navy);background:var(--amber);border-radius:5px;padding:1px 6px;margin-left:6px}
.andonempty{text-align:center;color:var(--green);font-size:20px;font-weight:800;padding:60px}
/* banner de alarme (sirene) no topo dos Atrasados */
.andonbar{display:flex;align-items:center;gap:16px;border-radius:12px;padding:15px 22px;margin-bottom:14px;border:2px solid #fff;animation:andonbar .45s steps(1,end) infinite}
@keyframes andonbar{0%{background:linear-gradient(90deg,#FF2D55,#FF8A00);box-shadow:0 0 38px 7px rgba(255,45,85,.8)}50%{background:linear-gradient(90deg,#FF8A00,#FF2D55);box-shadow:0 0 10px 0 rgba(255,138,0,.35)}}
.andonbar .ico{font-size:32px;line-height:1;animation:sirene .45s ease-in-out infinite}
.andonbar .ttl{font-weight:900;color:#fff;font-size:23px;letter-spacing:.03em;text-shadow:0 2px 6px rgba(0,0,0,.5)}
/* card frenético */
.sepcat.andon{border:2px solid #FF2D55;animation:andonfren .45s steps(1,end) infinite}
@keyframes andonfren{0%{box-shadow:0 0 34px 8px rgba(255,45,85,.9);border-color:#FF2D55}50%{box-shadow:0 0 4px 0 rgba(255,45,85,.12);border-color:rgba(255,84,112,.3)}}
.sepcat.andon>.h{color:#FF5470;font-size:17px}
.sepcat.andon>.h .cnt{color:#FF8A8A}
/* placar — campeão piscando azul com fogos */
.plrow.winner{border:2px solid var(--cyan);animation:celebra .8s ease-in-out infinite}
@keyframes celebra{0%,100%{box-shadow:0 0 30px 6px rgba(0,212,255,.85)}50%{box-shadow:0 0 8px 0 rgba(0,212,255,.22)}}
.champ{display:inline-block;margin-left:10px;font-size:12px;font-weight:900;color:var(--navy);background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:20px;padding:3px 12px;animation:champflash .8s ease-in-out infinite;vertical-align:middle}
@keyframes champflash{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.07)}}
.plrow{display:grid;grid-template-columns:54px 1fr 130px 96px;gap:14px;align-items:center;background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px}
.plrow .pos{font-size:24px;font-weight:900;text-align:center}
.plrow .nm{font-size:16px;font-weight:800}
.plrow .barwrap{height:10px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-top:7px}
.plrow .barwrap>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan))}
.plrow .pct{font-size:28px;font-weight:900;text-align:right}
.plrow .sub{font-size:11px;color:var(--mut);text-align:right;margin-top:2px}
.perbtns{display:flex;gap:6px}
.perbtn{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.perbtn.on{background:var(--card2);color:var(--cyan);border-color:var(--cyan)}
.histfilt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.histfilt select,.histfilt input{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 11px;font-family:inherit;font-weight:600;font-size:13px;outline:none}
.htable{width:100%;border-collapse:collapse;font-size:13px}
.htable th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--navy)}
.htable td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05)}
.est{font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px}
.est.separado{background:rgba(0,229,160,.14);color:var(--green)}
.est.enviado{background:rgba(255,176,32,.16);color:var(--amber)}
.est.recebido{background:rgba(0,212,255,.14);color:var(--cyan)}
.sepwait{padding:50px;text-align:center;color:var(--mut);font-size:15px}
/* ===== CLIENTES vigiados (sensível / atenção) ===== */
.msbtn.sens.on{color:var(--red)} .msbtn.aten.on{color:var(--amber)}
.clihead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.clihead h2{font-size:19px;font-weight:900}
.clihead .you{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.clihead .you select{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font-family:inherit;font-weight:700;font-size:13px;outline:none}
.clibody{flex:1;overflow-y:auto;min-height:0;padding-right:6px}
.clibody::-webkit-scrollbar{width:7px}.clibody::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:3px}
.srch{position:relative;margin-bottom:14px}
.srch input{width:100%;background:#0c1c2e;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:#fff;font-size:15px;font-family:inherit;outline:none}
.srch input:focus{border-color:var(--cyan)}
.srchres{position:absolute;left:0;right:0;top:52px;z-index:5;background:#0c1f33;border:1px solid var(--line);border-radius:10px;max-height:320px;overflow-y:auto;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.srchres .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
.srchres .r:hover{background:#13294a}
.srchres .r .add{font-size:12px;font-weight:800;color:var(--navy);border-radius:7px;padding:3px 10px}
.clihalf h3{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
.alertcard{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-radius:12px;padding:15px 18px;margin-bottom:11px;border:2px solid #fff}
.alertcard.sensivel{animation:flashred .5s steps(1,end) infinite}
.alertcard.atencao{animation:flashamber .5s steps(1,end) infinite}
@keyframes flashred{0%{background:linear-gradient(90deg,#FF2D55,#FF5470);box-shadow:0 0 48px 10px rgba(255,45,85,.95);border-color:#fff}50%{background:linear-gradient(90deg,#5a0010,#1c0007);box-shadow:0 0 5px 0 rgba(255,45,85,.12);border-color:rgba(255,84,112,.35)}}
@keyframes flashamber{0%{background:linear-gradient(90deg,#FF9500,#FFC23D);box-shadow:0 0 48px 10px rgba(255,176,32,.92);border-color:#fff}50%{background:linear-gradient(90deg,#4a3000,#1d1300);box-shadow:0 0 5px 0 rgba(255,176,32,.12);border-color:rgba(255,176,32,.35)}}
.alertcard .cli{font-size:19px;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.75)}
.alertcard .big2{font-size:16px;font-weight:800;color:#fff;margin-top:4px;text-shadow:0 1px 3px rgba(0,0,0,.65)}
.alertcard .big2 .reg{background:rgba(0,0,0,.35);border-radius:6px;padding:1px 8px;font-variant-numeric:tabular-nums}
.alertcard .meta{font-size:12px;color:#fff;opacity:.92;margin-top:4px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.alertcard .meta b{color:#fff;font-weight:700}
.alertcard .baixab{background:#fff;color:#0a1628;border:0;border-radius:8px;padding:11px 17px;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.regchip{display:inline-flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:6px 8px 6px 14px;margin:0 8px 8px 0;font-size:13px;font-weight:700}
.regchip.sensivel{border-color:rgba(255,45,85,.5)} .regchip.atencao{border-color:rgba(255,176,32,.5)}
.regchip .x{background:rgba(255,255,255,.08);border:0;color:var(--mut);width:22px;height:22px;border-radius:50%;cursor:pointer;font-weight:900;line-height:1}
.regchip .x:hover{background:var(--red);color:#fff}
.clicount{font-size:12px;color:var(--mut);font-weight:600}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <img src="logo-full.png" alt="Alpha Labs" style="width:150px;margin:0 auto 14px;display:block"><h2>Painel de Produção</h2><p>Acesso da equipe</p>
    <form id="gateForm" autocomplete="off">
      <input id="gatePwd" type="password" placeholder="Senha da equipe" autocomplete="current-password" autofocus>
      <button type="submit" id="gateBtn">Entrar</button>
      <button type="button" id="gateBio" style="display:none;width:100%;margin-top:9px;background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:14px;border-radius:10px;padding:11px;cursor:pointer;font-family:inherit">👆 Entrar com digital</button>
      <div id="gateErr" class="gate-err"></div>
    </form>
  </div>
</div>
<button id="bioSetup" style="display:none;position:fixed;right:14px;bottom:14px;z-index:30;background:rgba(10,22,40,.92);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">👆 Proteger com digital</button>
<div id="tv" style="display:none">
  <div class="bar">
    <div class="brand"><img src="logo.png" alt="Alpha Labs" class="logo">
      <div><h1 id="title">Produção · Laboratório Alpha</h1><div class="sb" id="subtitle">Fila operacional · prazos</div><div class="sb" style="color:#00D4FF;margin-top:2px">Agentes de IA Alpha</div></div>
    </div>
    <div class="barright">
      <div class="modesw" id="modesw">
        <button class="msbtn on" data-m="tv">📺 Produção</button>
        <button class="msbtn alt" data-m="sep">🔬 Triagem de Amostras</button>
        <button class="msbtn sens" data-m="cli-sensivel">🔴 Sensíveis</button>
        <button class="msbtn aten" data-m="cli-atencao">🟡 Atenção</button>
      </div>
      <div class="refresh"><span class="dot"></span><span id="upd">—</span></div>
      <div class="clock"><div class="t" id="clk">--:--</div><div class="d" id="dat">—</div></div>
    </div>
  </div>
  <div id="tabs" class="tabs"></div>
  <div id="content" class="content"></div>
  <div id="sep" class="sep" style="display:none"></div>
  <div id="cli" class="sep" style="display:none"></div>
</div>
<script src="app.js"></script>
<script src="sep.js"></script>
<script src="cli.js"></script>
</body>
</html>
