name: Vigia da Frota (health check + alerta)

# Roda no servidor do GitHub (independe de app aberto). A cada 15 min no horário de operação,
# testa DE VERDADE o painel de Triagem/Produção (site, dados, ler, GRAVAR+ler de volta, e se a
# leitura paginada traz TODAS as marcas — o bug de 08/jul). Só AVISA (e-mail + WhatsApp) se QUEBRAR.
# Objetivo SRE: detectar a pane ANTES da equipe sentir (ontem a equipe descobriu, horas depois).

on:
  schedule:
    - cron: '*/15 0-2,9-23 * * *'   # a cada 15 min, ~06h-23h BRT (UTC=BRT+3; 0-2 cobre a 2ª rotina da noite)
  workflow_dispatch:            # rodar agora p/ testar
    inputs:
      teste_autocura:
        description: "1 = FIRE-DRILL da auto-cura: dispara o redeploy do painel p/ provar o mecanismo (redeploy é inofensivo)"
        required: false
        default: "0"
  # 23/set: MEDIDO — o cron pede 15 min e o GitHub estava entregando UMA execução a cada 3-5 HORAS
  # (repo público = agendamento de baixa prioridade; o inclusoes_hf.yml já tinha sofrido o mesmo em
  # 17/set). Um vigia que dorme 4 h não é vigia. O "Atualiza Painel de Produção" roda de 10 em 10 min
  # e é confiável → pegamos carona nele. Sem `if:` de horário de propósito: o cron do painel já é
  # '*/10 0-2,9-23', exatamente a mesma janela daqui — então a carona nunca cai fora da hora e não
  # gera `skipped` (que é o que enchia o vigia dos robôs de alarme falso).
  workflow_run:
    workflows: ["Atualiza Painel de Produção"]
    types: [completed]

concurrency:
  group: vigia-frota
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write        # p/ AUTO-CURA: disparar o "Atualiza Painel de Produção" (deploy=1) sozinho
      contents: read
    steps:
      - name: Health check da frota + alerta
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          CALLMEBOT_PHONE:    ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY:   ${{ secrets.CALLMEBOT_APIKEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          MYSQL_HOST:         ${{ secrets.MYSQL_HOST }}
          MYSQL_USER:         ${{ secrets.MYSQL_USER }}
          MYSQL_PWD:          ${{ secrets.MYSQL_PWD }}
          MYSQL_DB:           ${{ secrets.MYSQL_DB }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}   # AUTO-CURA: dispara o redeploy do painel
          GH_REPO:            ${{ github.repository }}
          TESTE_AUTOCURA:     ${{ github.event.inputs.teste_autocura }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pymysql 2>/dev/null || pip3 install --quiet pymysql 2>/dev/null || true
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, datetime, time, smtplib, ssl
          from email.mime.text import MIMEText

          SUPA="https://lrwjcdvporaivxvfuiwt.supabase.co/rest/v1"
          KEY="sb_publishable_fcodHc3AxR_HQ-aduMGzlg_CTBALng8"
          SITE="https://producao-lab-alpha.netlify.app"

          def http(url, method="GET", headers=None, data=None, timeout=25):
              req=urllib.request.Request(url, method=method, data=data, headers=headers or {})
              r=urllib.request.urlopen(req, timeout=timeout)
              return r.status, r.read(), dict(r.headers)
          def supa(path, method="GET", headers=None, body=None):
              h={"apikey":KEY,"Authorization":"Bearer "+KEY}
              if headers: h.update(headers)
              d=body.encode() if isinstance(body,str) else body
              return http(SUPA+path, method, h, d)

          falhas=[]; ctx=[]
          # 1) site do painel no ar
          try:
              st,_,_=http(SITE+"/?_="+str(int(time.time())))
              if st!=200: falhas.append(f"Site do painel: HTTP {st}")
          except Exception as e: falhas.append(f"Site do painel: {e}")
          # 2) dados do painel (/api/enc) frescos — com RE-CHECK: um 404 transitório acontece na JANELA
          # de troca do deploy (Netlify publicando). Sem retry, isso vira alerta falso E auto-cura à toa.
          # Só conta como falha se as DUAS tentativas (com 8s de intervalo) falharem.
          def check_enc():
              try:
                  st,b,_=http(SITE+"/api/enc?_="+str(int(time.time())))
                  return (st==200 and len(b)>=1000), f"HTTP {st}, {len(b)}b"
              except Exception as e:
                  return False, str(e)
          ok_enc, det_enc = check_enc()
          if not ok_enc:
              time.sleep(8)
              ok_enc, det_enc = check_enc()   # 2ª chance: descarta a janela de deploy
          if not ok_enc: falhas.append(f"Dados do painel (/api/enc): {det_enc}")
          # 3) Supabase LER
          try:
              st,_,_=supa("/sep_marks?select=chave&limit=1")
              if st!=200: falhas.append(f"Supabase leitura: HTTP {st}")
          except Exception as e: falhas.append(f"Supabase leitura: {e}")
          # 4) Supabase GRAVAR + ler de volta + apagar (caminho real do separar)
          hc="zzz_vigia_"+datetime.datetime.utcnow().strftime("%H%M%S")
          try:
              st,_,_=supa("/sep_marks","POST",{"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"},json.dumps({"chave":hc,"estado":"separado","por":"vigia"}))
              if st not in (200,201): falhas.append(f"Supabase gravação: HTTP {st}")
              else:
                  st2,b,_=supa("/sep_marks?chave=eq."+hc+"&select=chave")
                  if not (st2==200 and json.loads(b)): falhas.append("Gravou mas não leu de volta")
              supa("/sep_marks?chave=eq."+hc,"DELETE")
          except Exception as e: falhas.append(f"Supabase gravação: {e}")
          # 5) PAGINAÇÃO: a leitura traz TODAS as marcas? (o bug de 08/jul = corte em 1000)
          total=0
          try:
              st,_,h=supa("/sep_marks?select=chave&limit=1",headers={"Prefer":"count=exact","Range":"0-0"})
              total=int((h.get("Content-Range") or h.get("content-range") or "/0").split("/")[-1])
              loaded=0; frm=0
              while True:
                  st,b,_=supa(f"/sep_marks?select=chave&offset={frm}&limit=1000")
                  n=len(json.loads(b)); loaded+=n
                  if n<1000: break
                  frm+=1000
              ctx.append(f"sep_marks: {total} marcas (paginação carregou {loaded})")
              if loaded<total: falhas.append(f"Painel não carrega TODAS as marcas: {loaded}/{total} (bug tipo 08/jul!)")
          except Exception as e: falhas.append(f"Check paginação: {e}")

          agora=(datetime.datetime.utcnow()-datetime.timedelta(hours=3)).strftime("%d/%m %H:%M BRT")
          def alerta(assunto, corpo, wa):
              try:
                  GU=os.environ["GMAIL_USER"]; GP=os.environ["GMAIL_APP_PASSWORD"]; TO=os.environ.get("EMAIL_TO") or GU
                  m=MIMEText(corpo,"plain","utf-8"); m["Subject"]=assunto; m["From"]=GU; m["To"]=TO
                  with smtplib.SMTP_SSL("smtp.gmail.com",465,context=ssl.create_default_context()) as s:
                      s.login(GU,GP); s.sendmail(GU,[TO],m.as_string())
                  print("email enviado:",assunto)
              except Exception as e: print("email falhou:",e)
              try:
                  ph=os.environ.get("CALLMEBOT_PHONE","").strip(); ak=os.environ.get("CALLMEBOT_APIKEY","").strip()
                  if ph and ak:
                      u=("https://api.callmebot.com/whatsapp.php?phone="+urllib.parse.quote(ph)+"&text="+urllib.parse.quote(wa)+"&apikey="+urllib.parse.quote(ak))
                      urllib.request.urlopen(u,timeout=30).read(); print("whatsapp enviado")
              except Exception as e: print("whatsapp falhou:",e)

          # ---- CAÇA-RUNAWAY 2 NÍVEIS: aviso (rajada) + DISJUNTOR (corte automático) ----
          # Conta deploys de PRODUÇÃO por site nos últimos ~35 min (TAXA, não total/dia → sem estado,
          # sem spam em dia de dev). Nível 1 (WARN_N): só avisa. Nível 2 (CUT_N): FREIA o site ofensor.
          # Freio por tipo (ambos REVERSÍVEIS): git-build → stop_builds; deploy-direto → trava o deploy
          # publicado (a versão no ar SEGUE servindo a equipe; só bloqueia publicar código novo/loop).
          # PROTEGIDOS = apps operacionais da equipe: SÓ avisam, NUNCA cortam automático.
          WARN_N=12; CUT_N=20; BURST_MIN=35
          PROTEGIDOS={"producao-lab-alpha"}
          try:
              NT=os.environ.get("NETLIFY_AUTH_TOKEN","").strip()
              if NT:
                  def napi(p, method="GET", body=None):
                      data=json.dumps(body).encode() if body is not None else None
                      h={"Authorization":"Bearer "+NT}
                      if body is not None: h["Content-Type"]="application/json"
                      rq=urllib.request.Request("https://api.netlify.com/api/v1"+p, method=method, data=data, headers=h)
                      rr=urllib.request.urlopen(rq, timeout=25); bb=rr.read()
                      return rr.status, (json.loads(bb) if bb else {})
                  corte_ts=datetime.datetime.utcnow()-datetime.timedelta(minutes=BURST_MIN)
                  avisos=[]; cortes=[]
                  _,allsites=napi("/sites?per_page=100")
                  for s in allsites:
                      sid=s.get("id"); nm=s.get("name","")
                      if not sid: continue
                      try: _,deps=napi(f"/sites/{sid}/deploys?per_page=100")
                      except Exception: continue
                      n=0
                      for d in deps:
                          if d.get("context")!="production": continue
                          ts=(d.get("created_at") or "")[:19]
                          try: t=datetime.datetime.strptime(ts,"%Y-%m-%dT%H:%M:%S")
                          except Exception: continue
                          if t>=corte_ts: n+=1
                      if n<WARN_N: continue
                      if n>=CUT_N and nm not in PROTEGIDOS:
                          bs=s.get("build_settings") or {}
                          git=bool(bs.get("repo_url") or bs.get("provider"))
                          acao="?"
                          try:
                              if git:
                                  napi(f"/sites/{sid}","PATCH",{"build_settings":{"stop_builds":True}})
                                  acao="builds parados (stop_builds=true)"
                              else:
                                  dep=(s.get("published_deploy") or {}).get("id")
                                  if dep:
                                      napi(f"/deploys/{dep}/lock","POST")
                                      acao="deploy publicado TRAVADO (versão no ar mantida)"
                                  else:
                                      acao="sem deploy p/ travar — só avisei"
                          except Exception as e:
                              acao=f"FALHOU o freio: {e}"
                          cortes.append((nm,n,acao))
                      else:
                          tag=" (PROTEGIDO: só aviso)" if (n>=CUT_N and nm in PROTEGIDOS) else ""
                          avisos.append((nm,n,tag))
                  if cortes or avisos:
                      linhas=[]
                      if cortes:
                          linhas.append("🔴 CORTADO (disjuntor armou):")
                          linhas += [f"  • {nm}: {n} deploys/{BURST_MIN}min → {ac}" for nm,n,ac in cortes]
                      if avisos:
                          linhas.append("⚠️ Rajada (só aviso):")
                          linhas += [f"  • {nm}: {n} deploys/{BURST_MIN}min{tag}" for nm,n,tag in avisos]
                      corpo=(f"Wal ({agora}) — o caça-runaway de deploy disparou.\n\n"+"\n".join(linhas)
                             +"\n\nSe foi VOCÊ desenvolvendo, tudo bem. Se NÃO foi, é loop/auto-deploy — a FONTE "
                             +"(GitHub Action/build hook) precisa ser cortada.\n\n"
                             +"RELIGAR quando seguro: git-build → pôr stop_builds=false no site; deploy travado → "
                             +"destravar (unlock) o deploy publicado.\n"
                             +"A equipe NÃO para: o app no ar e os dados do Supabase seguem normais (deploy só troca CÓDIGO).")
                      assunto=("🔴 DISJUNTOR armou: "+", ".join(nm for nm,_,_ in cortes)) if cortes else ("🔥 Rajada de deploy: "+", ".join(nm for nm,_,_ in avisos))
                      wa=(("🔴 Disjuntor armou: "+", ".join(f"{nm}({n})" for nm,n,_ in cortes)+". Freado p/ proteger crédito; equipe segue normal.") if cortes
                          else ("🔥 Rajada: "+", ".join(f"{nm}({n})" for nm,n,_ in avisos)+". Se não foi você, corte a fonte."))
                      alerta(assunto, corpo, wa)
                      print("CACA-RUNAWAY:",assunto)
                  else:
                      print("caca-runaway: nada (warn>=%d, cut>=%d /%dmin)"%(WARN_N,CUT_N,BURST_MIN))
              else:
                  print("caca-runaway: NETLIFY_AUTH_TOKEN ausente")
          except Exception as e:
              print("caca-runaway falhou:",e)

          # ---- FRESCOR DO DADO: a CÓPIA que o painel lê está atualizando? ----
          # O painel lê a réplica MySQL bi_alpha. Se ela CONGELA (a replicação do HF parou —
          # aconteceu 21/jul 17:56), o site responde 200 e a paginação passa, MAS o dado está
          # velho e a equipe NÃO vê o que acabou de entrar. Este é o check que teria gritado.
          # Alerta só nas horas de MOVIMENTO (evita falso-positivo de madrugada/lab fechado).
          # Checa DOIS sinais: (1) FREEZE TOTAL (nem update flui) e (2) INSERT-STOP (updates fluem
          # mas NENHUMA requisição NOVA entra — o caso 23/jul: DataModificacao fresca com updates de
          # registros velhos, mas 0 requisição nova). Só olhar DataModificacao NÃO pega o caso (2).
          lab_operando=False   # visível pro bloco de recuperação abaixo
          try:
              import pymysql
              MH=os.environ.get("MYSQL_HOST"); MU=os.environ.get("MYSQL_USER")
              MP=os.environ.get("MYSQL_PWD"); MDB=os.environ.get("MYSQL_DB") or "bi_alpha"
              if MH and MU and MP:
                  cnx=pymysql.connect(host=MH,user=MU,password=MP,database=MDB,connect_timeout=20,charset="utf8mb4")
                  with cnx.cursor() as mc:
                      mc.execute("SELECT NOW()"); now_db=mc.fetchone()[0]
                      mc.execute("SELECT MAX(DataModificacao) FROM `TabExameNumeroRequisiçao`"); ult=mc.fetchone()[0]
                      mc.execute("SELECT MAX(ADDTIME(CAST(DataEntrada AS DATETIME), UsuarioHoraEntrada)) FROM `TabExameNumeroRequisiçao` WHERE DataEntrada>=DATE_SUB(CURDATE(),INTERVAL 3 DAY) AND UsuarioHoraEntrada IS NOT NULL"); ins=mc.fetchone()[0]
                      mc.execute("SELECT COUNT(*) FROM `TabExameNumeroRequisiçao` WHERE DataEntrada>=CURDATE()"); req_hoje=mc.fetchone()[0] or 0
                      # GUARDIÃO DE DUPLICIDADE (14/set): a chave de baixa do painel é NumeroSequencial-CodExame.
                      # Provado que o número NÃO repete entre anos, então hoje é seguro; este check só ALERTA se um dia
                      # 2 requisições DIFERENTES (telas distintas) caírem na mesma chave na janela ativa — aí a baixa
                      # poderia marcar a errada. Read-only, custo zero, quase nunca dispara. Blindar chaveOf p/ tela se soar.
                      mc.execute("""SELECT r.NumeroSequencial, s.CodExame, COUNT(DISTINCT r.CodNumeroSequencialTela) telas
                        FROM TabExameNumeroSolicitado s JOIN `TabExameNumeroRequisiçao` r ON s.CodNumeroSequencialTela=r.CodNumeroSequencialTela
                        WHERE r.DataEntrada>=DATE_SUB(CURDATE(),INTERVAL 30 DAY) AND s.DataExame IS NULL
                          AND r.NumeroSequencial IS NOT NULL AND r.NumeroSequencial>0
                        GROUP BY r.NumeroSequencial, s.CodExame HAVING COUNT(DISTINCT r.CodNumeroSequencialTela)>1 LIMIT 5""")
                      colisoes=mc.fetchall()
                  cnx.close()
                  if colisoes:
                      e0=colisoes[0]
                      falhas.append(f"COLISÃO DE CHAVE no painel: nº {e0[0]} + exame cod {e0[1]} está em {e0[2]} requisições distintas ({len(colisoes)} caso(s)) — a baixa pode marcar a errada. Blindar chaveOf (usar CodNumeroSequencialTela).")
                  # ⚠️ FREEZE = a réplica parou de receber dado DURANTE a janela em que o lab COMPROVADAMENTE opera.
                  # NÃO gatear por volume (req_hoje): o próprio freeze derruba o volume e silenciaria o alarme
                  # (ERRO 27/jul: réplica congelou 10:49 numa segunda cheia; req_hoje=10 fez o >=40 achar "lab
                  # parado" e ficar quieto — o congelamento escondeu o detector). O sinal honesto é o ATRASO
                  # desde a última escrita, dentro da janela. Domingo fecha mais cedo (evita falso alarme 26/jul).
                  nb=datetime.datetime.utcnow()-datetime.timedelta(hours=3); wd=nb.weekday(); hb=nb.hour
                  janela = (12<=hb<=21) if wd<=5 else (12<=hb<=16)   # seg-sáb dia cheio / dom reduzido
                  lab_operando = janela   # nome mantido pro bloco de recuperação abaixo
                  ctx.append(f"janela_operacao={janela} (req_hoje={req_hoje}, {['seg','ter','qua','qui','sex','sab','dom'][wd]} {hb}h)")
                  if ult:   # (1) freeze total — nem update flui; só olha ATRASO, sem gate de volume
                      atraso=(now_db-ult).total_seconds()/60.0
                      if atraso>240 and janela:
                          falhas.append(f"CÓPIA CONGELADA: sem NENHUMA atualização há {int(atraso)} min (última {ult}; só {req_hoje} req hoje). A réplica bi_alpha parou de replicar — o painel de Produção está CEGO. A equipe não sente (trabalha no HF vivo), mas o BI está travado.")
                      ctx.append(f"frescor modif: {ult} ({int(atraso)}min)")
                  if ins and not isinstance(ins, datetime.datetime):   # ADDTIME volta STRING neste MySQL
                      try: ins=datetime.datetime.strptime(str(ins)[:19],"%Y-%m-%d %H:%M:%S")
                      except Exception: ins=None
                  if ins:   # (2) INSERT-stop — updates fluem mas requisição NOVA não entra
                      atr_ins=(now_db-ins).total_seconds()/60.0
                      if atr_ins>300 and janela:
                          falhas.append(f"REQUISIÇÕES NOVAS paradas na cópia há {int(atr_ins)} min (última entrada {ins}). O HF recebe, mas a réplica bi_alpha NÃO traz as novas. (updates fluem, só o INSERT parou).")
                      ctx.append(f"frescor entrada: {ins} ({int(atr_ins)}min)")
              else:
                  print("frescor: MYSQL_* ausente")
          except Exception as e:
              print("frescor check falhou:", e)

          # ---- RECUPERAÇÃO: se ESTAVA congelado e AGORA voltou → avisa "✅ voltou" ----
          # Guarda o estado anterior numa linha do sep_marks (chave zzz_vigia_estado, não casa exame).
          # Detecta a TRANSIÇÃO congelado→ok e manda 1 alerta positivo (o Wal não precisa ficar de olho).
          # só rastreia/decide quando o LAB ESTÁ OPERANDO (senão staleness = lab fechado/dia parado, ambíguo)
          if lab_operando:
              try:
                  congelado = any(('CONGELADA' in f or 'REQUISIÇÕES NOVAS paradas' in f) for f in falhas)
                  st_prev=None
                  try:
                      _,b,_=supa("/sep_marks?chave=eq.zzz_vigia_estado&select=obs")
                      arr=json.loads(b) if b else []; st_prev=(arr[0].get("obs") if arr else None)
                  except Exception: pass
                  if st_prev=="congelado" and not congelado:
                      alerta("✅ Painel VOLTOU a atualizar",
                             f"Boa notícia Wal ({agora}): a cópia do painel de Produção VOLTOU a receber dado — o feed foi religado. O painel reconstrói sozinho em ~10 min (disparador). A equipe já pode confiar no painel de novo.",
                             f"✅ Painel de Produção VOLTOU ({agora}) — cópia fresca de novo. Reconstrói sozinho em ~10min.")
                  try:
                      supa("/sep_marks","POST",{"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"},
                           json.dumps({"chave":"zzz_vigia_estado","estado":"vigia","por":"vigia","obs":("congelado" if congelado else "ok")}))
                  except Exception: pass
              except Exception as e:
                  print("recuperacao check falhou:",e)

          # ---- AUTO-CURA (24/set/2026): SITE no ar + /api/enc caído = FUNÇÕES apagadas por deploy errado
          # (incidente 24/set: netlify deploy local da raiz derrubou todas as funções). Dispara o redeploy
          # OFICIAL (atualiza.yml deploy=1) sozinho. Cooldown de 20 min (marca em sep_marks) p/ não virar
          # tempestade de deploy. Só age nesta assinatura exata — se o SITE tb caiu, é outra coisa: só avisa.
          def dispara_redeploy():
              """Dispara o 'Atualiza Painel de Produção' (deploy=1) via API. Retorna (ok, http)."""
              repo=os.environ["GH_REPO"]; tok=os.environ["GH_TOKEN"]
              body=json.dumps({"ref":"main","inputs":{"deploy":"1"}}).encode()
              h={"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json",
                 "X-GitHub-Api-Version":"2022-11-28","User-Agent":"vigia-frota","Content-Type":"application/json"}
              st_d,_,_=http(f"https://api.github.com/repos/{repo}/actions/workflows/atualiza.yml/dispatches","POST",h,body)
              return st_d in (201,204), st_d

          # FIRE-DRILL manual: prova que o token consegue disparar o redeploy (redeploy é inofensivo).
          if os.environ.get("TESTE_AUTOCURA")=="1":
              try:
                  ok,st_d=dispara_redeploy()
                  print(f"[FIRE-DRILL] auto-cura dispatch HTTP {st_d} -> {'OK, redeploy disparado' if ok else 'FALHOU'}")
              except Exception as e:
                  print("[FIRE-DRILL] auto-cura FALHOU ao disparar:",e)
              raise SystemExit(0)

          auto_cura_msg=""
          enc_falhou=any(f.startswith("Dados do painel (/api/enc)") for f in falhas)
          site_falhou=any(f.startswith("Site do painel") for f in falhas)
          if enc_falhou and not site_falhou:
              recente=False
              try:
                  _,b,_=supa("/sep_marks?chave=eq.zzz_vigia_autocura&select=obs")
                  arr=json.loads(b) if b else []
                  if arr and arr[0].get("obs"):
                      last=datetime.datetime.strptime(arr[0]["obs"][:19],"%Y-%m-%dT%H:%M:%S")
                      recente=(datetime.datetime.utcnow()-last).total_seconds()<1200
              except Exception: pass
              if recente:
                  auto_cura_msg="\n\n🔧 Auto-cura já disparada nos últimos 20 min (redeploy em andamento) — aguardando voltar."
              else:
                  try:
                      ok,st_d=dispara_redeploy()
                      if ok:
                          auto_cura_msg=("\n\n🔧 AUTO-CURA DISPARADA: redeploy oficial do painel (atualiza.yml deploy=1). "
                                         "Deve voltar sozinho em ~2-3 min. Se NÃO voltar, é pane real — verifique.")
                          try:
                              supa("/sep_marks","POST",{"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"},
                                   json.dumps({"chave":"zzz_vigia_autocura","estado":"vigia","por":"vigia","obs":datetime.datetime.utcnow().isoformat()}))
                          except Exception: pass
                      else:
                          auto_cura_msg=f"\n\n⚠️ Auto-cura tentada mas o disparo falhou (HTTP {st_d}) — redeploy manual necessário."
                      print("auto-cura dispatch HTTP:",st_d)
                  except Exception as e:
                      auto_cura_msg=f"\n\n⚠️ Auto-cura falhou ao disparar ({e}) — redeploy manual necessário."

          # PANE (qualquer check falhou) -> alerta NA HORA
          if falhas:
              corpo=(f"ALERTA Wal ({agora}) — o painel está com problema pra a equipe:\n\n"
                     + "\n".join("❌ "+f for f in falhas)
                     + ("\n\nContexto: "+" | ".join(ctx) if ctx else "")
                     + auto_cura_msg
                     + "\n\nA equipe pode estar travada. Enquanto verifica: modo papel (separa físico, marca depois — nada se perde).")
              wa_extra=" 🔧 auto-cura disparada (redeploy)." if "AUTO-CURA DISPARADA" in auto_cura_msg else ""
              alerta("🚨 PANE no painel de Triagem/Produção", corpo,
                     f"🚨 PANE no painel Triagem/Produção ({agora}): "+"; ".join(falhas[:3])+"."+wa_extra+" Equipe pode estar travada — modo papel enquanto verifica.")
              raise SystemExit(0)

          # SATURAÇÃO: a tabela cresce sempre (finalizadas não são apagadas). Aviso GENTIL 1x/dia
          # (só na rodada ~08h BRT). NÃO é pane — o painel funciona (paginação lê tudo); é heads-up
          # p/ arquivar as finalizadas antes de ficar pesado.
          _h=datetime.datetime.utcnow()
          if total>3000 and _h.hour==11 and _h.minute<15:
              alerta("📈 sep_marks grande — hora de arquivar as finalizadas",
                     f"Heads-up Wal ({agora}): sep_marks está com {total} linhas e cresce sempre. O painel FUNCIONA "
                     f"(a paginação lê tudo), mas fica mais pesado/lento conforme cresce. Vale rodar a limpeza/arquivo "
                     f"das marcas antigas 'suficiente'. Sem urgência.",
                     f"📈 sep_marks: {total} linhas (cresce sempre). Painel ok, mas vale arquivar as finalizadas. Sem urgência.")
          print(f"[{agora}] ✅ frota OK — {' | '.join(ctx)}")
          PY
