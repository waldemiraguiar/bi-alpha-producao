<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produção · Lab Alpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1628;--navy2:#0F2138;--card:#10243d;--line:rgba(0,212,255,.18);
  --ink:#F5F7FA;--mut:#8aa2bd;--cyan:#00D4FF;--green:#00E5A0;--amber:#FFB020;--red:#FF5470;--purple:#A78BFA;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:
   radial-gradient(1400px 700px at 85% -10%,rgba(0,212,255,.08),transparent 60%),
   radial-gradient(1200px 600px at -10% 10%,rgba(0,229,160,.06),transparent 55%),var(--navy);
  color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;padding:16px 30px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:15px}
.logo{width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--green));
  display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--navy);font-size:25px;box-shadow:0 6px 24px rgba(0,212,255,.4)}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand .sb{color:var(--mut);font-size:12.5px;font-weight:500;margin-top:3px;letter-spacing:.16em;text-transform:uppercase}
.barright{display:flex;align-items:center;gap:24px}
.clock{text-align:right}.clock .t{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.clock .d{color:var(--mut);font-size:12.5px;text-transform:capitalize}
.refresh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,229,160,.5)}70%{box-shadow:0 0 0 9px rgba(0,229,160,0)}100%{box-shadow:0 0 0 0 rgba(0,229,160,0)}}
.stage{height:calc(100vh - 84px);padding:16px 26px 20px;display:grid;grid-template-columns:1.55fr 1fr;grid-template-rows:auto 1fr;gap:15px}
/* KPIs topo */
.kpis{grid-column:1/3;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:13px;padding:13px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cyan)}
.kpi.gr::before{background:var(--green)}.kpi.rd::before{background:var(--red)}.kpi.am::before{background:var(--amber)}.kpi.pp::before{background:var(--purple)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700}
.kpi .v{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin-top:4px}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:3px}
.card{background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;min-height:0}
.card h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card h3 .tag{font-size:11px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.scroll{overflow-y:auto;min-height:0}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:3px}
/* categorias */
.catrow{display:grid;grid-template-columns:1.5fr auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.catname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catname .slatag{font-size:10.5px;color:var(--mut);font-weight:600;margin-left:7px;border:1px solid var(--line);padding:1px 6px;border-radius:20px}
.catopen{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;min-width:48px}
.catopen small{display:block;font-size:10px;color:var(--mut);font-weight:600;text-transform:uppercase}
.barwrap{height:11px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;display:flex}
.barwrap .ok{background:var(--green)}.barwrap .late{background:var(--red)}
.catflow{font-size:11.5px;color:var(--mut);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.catflow b{color:var(--ink);font-weight:700}
.pctpill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
/* atrasados */
.late-it{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.late-badge{font-size:13px;font-weight:800;color:var(--red);background:rgba(255,84,112,.13);border-radius:8px;padding:5px 9px;text-align:center;min-width:54px;font-variant-numeric:tabular-nums}
.late-badge small{display:block;font-size:9px;color:var(--mut);font-weight:600}
.late-ex{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.late-cat{font-size:11px;color:var(--mut)}
.late-sla{font-size:11px;color:var(--amber);text-align:right;white-space:nowrap}
/* gate */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 50% 0,rgba(0,212,255,.1),transparent 60%),var(--navy)}
.gate-card{width:360px;max-width:90vw;background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:18px;padding:40px 32px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.gate-logo{width:60px;height:60px;border-radius:15px;margin:0 auto 18px;background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--navy);font-size:30px}
.gate-card h2{font-size:22px;font-weight:800}.gate-card p{color:var(--mut);font-size:13px;margin:5px 0 24px}
#gateForm{display:flex;flex-direction:column;gap:13px}
#gatePwd{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:13px 15px;color:var(--ink);font-size:15px;font-family:inherit;outline:none}
#gatePwd:focus{border-color:var(--cyan)}
#gateBtn{background:linear-gradient(135deg,var(--cyan),var(--green));color:var(--navy);font-weight:800;font-size:15px;border:none;border-radius:10px;padding:13px;cursor:pointer;font-family:inherit}
.gate-err{color:var(--red);font-size:12.5px;min-height:16px}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">α</div>
    <h2>Painel de Produção</h2><p>Acesso da equipe</p>
    <form id="gateForm" autocomplete="off">
      <input id="gatePwd" type="password" placeholder="Senha da equipe" autocomplete="current-password" autofocus>
      <button type="submit" id="gateBtn">Entrar</button>
      <div id="gateErr" class="gate-err"></div>
    </form>
  </div>
</div>
<div id="tv" style="display:none">
  <div class="bar">
    <div class="brand"><div class="logo">α</div>
      <div><h1>Produção · Laboratório Alpha</h1><div class="sb">Fila operacional · prazos de liberação</div></div>
    </div>
    <div class="barright">
      <div class="refresh"><span class="dot"></span><span id="upd">—</span></div>
      <div class="clock"><div class="t" id="clk">--:--</div><div class="d" id="dat">—</div></div>
    </div>
  </div>
  <div class="stage">
    <div class="kpis" id="kpis"></div>
    <div class="card"><h3>Fila por categoria <span class="tag">em processo · no prazo / atrasado</span></h3>
      <div class="scroll" id="cats"></div></div>
    <div class="card"><h3>Prioridade — atrasados <span class="tag">passaram do prazo</span></h3>
      <div class="scroll" id="late"></div></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
